<!DOCTYPE html>
<!-- The link preview image (og:image) for every page of statebilltracker.org: 1200 x 630. tools/og_image.sh screenshots
     it into tools/og-image.png, which build_site.sh copies to the top of the site as /og-image.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600&display=swap">
<style>
:root { --navy: #1d3b78; --paper: #f6f8fb; --gold: #e3b04b; --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Public Sans", "Helvetica Neue", Arial, sans-serif; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--navy); color: var(--paper); font-family: var(--body); position: relative; }
.text { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
h1 { font: 800 104px/0.95 var(--display); font-stretch: 85%; margin: 0 0 30px; letter-spacing: -0.01em; }
p { font-size: 32px; line-height: 1.3; margin: 0; color: #d3dcef; }
.bar { width: 96px; height: 10px; background: var(--gold); border-radius: 5px; margin: 0 0 34px; }
.tiles { position: absolute; right: 72px; top: 150px; display: grid; grid-template-columns: repeat(11, 36px);
  grid-template-rows: repeat(8, 36px); gap: 5px; }
.tiles i { border-radius: 6px; background: rgba(246, 248, 251, 0.22); }
.tiles i.g { background: var(--gold); }
</style>
</head>
<body>
<div class="text">
  <div class="bar"></div>
  <h1>State Bill Tracker</h1>
  <p>Follow bills in every state legislature and Congress.</p>
</div>
<div class="tiles" id="tiles"></div>
<script>
// The front page's tile map (home.html's GRID): one square per state, a few in gold.
const GRID = { AK: [0, 0], ME: [0, 10], VT: [1, 9], NH: [1, 10],
  WA: [2, 0], ID: [2, 1], MT: [2, 2], ND: [2, 3], MN: [2, 4], IL: [2, 5], WI: [2, 6], MI: [2, 7], NY: [2, 8], RI: [2, 9], MA: [2, 10],
  OR: [3, 0], NV: [3, 1], WY: [3, 2], SD: [3, 3], IA: [3, 4], IN: [3, 5], OH: [3, 6], PA: [3, 7], NJ: [3, 8], CT: [3, 9],
  CA: [4, 0], UT: [4, 1], CO: [4, 2], NE: [4, 3], MO: [4, 4], KY: [4, 5], WV: [4, 6], VA: [4, 7], MD: [4, 8], DE: [4, 9],
  AZ: [5, 1], NM: [5, 2], KS: [5, 3], AR: [5, 4], TN: [5, 5], NC: [5, 6], SC: [5, 7],
  OK: [6, 3], LA: [6, 4], MS: [6, 5], AL: [6, 6], GA: [6, 7],
  HI: [7, 0], TX: [7, 3], FL: [7, 7] };
const GOLD = new Set(["CO", "OH", "GA"]);
document.getElementById("tiles").innerHTML = Object.entries(GRID).map(([c, [r, k]]) =>
  `<i class="${GOLD.has(c) ? "g" : ""}" style="grid-area:${r + 1}/${k + 1}"></i>`).join("");
</script>
</body>
</html>
