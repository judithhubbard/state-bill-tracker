# Copied from ny-bill-tracker. Renamed, with no timer, so a deploy from here can't touch the live
# NY timer. Add crons once this project deploys a site of its own.
name = "state-cron"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false

# Fires hourly; src/index.js decides (in New York time) whether an update is due.
[triggers]
crons = []

# GITHUB_TOKEN is a secret (wrangler secret put GITHUB_TOKEN); it is never stored here.
