<!DOCTYPE html>
<!-- "Your bills" (/your-bills/): a tab for the bills starred in this browser (in any state or Congress, grouped by state),
     one for each list made here with the list editor, and one for each list this browser follows. A visitor can share the
     starred bills as one live list (lists_worker/, a list across states) that this page keeps in step with the stars.
     build_site.sh writes it to your-bills/index.html, putting common.css and common.js in place of their comments, the link
     preview tags and visit counter in place of the meta comment, and the addresses of the lists Worker (LISTS_API_URL) and
     the contributions page (SUPPORT_URL). Every tab's bills are one list across states (onelist.js), grouped by what's
     due first with each state's own deadline rules (watchrules.js); a bill opens in place, its card drawn by its state's
     page in a frame (embed.js's Opener). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your bills · State Bill Tracker</title>
<meta name="description" content="The bills you follow in every state and Congress: where each one is and what's new.">
<meta name="robots" content="noindex">
<!--meta-->
<meta name="lists-api" content="LISTS_API_URL">
<meta name="support" content="SUPPORT_URL">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Where each bill is: the index of the status pieces (common.js's statusOf()), wanted before the script runs. -->
<link rel="preload" href="/status.json" as="fetch" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/*common.css*/
.grp { font-weight: 600; color: var(--ink); }
.bystate { display: flex; justify-content: flex-end; margin: -8px 0 8px; font-size: 14px; color: var(--ink-2); }
.bystate label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="/">&larr; State Bill Tracker</a></p>
  <h1>Your bills</h1>
  <div class="tabbar">
    <div role="tablist" id="tablist" aria-label="Your lists"></div>
    <div class="morewrap" id="moreWrap" hidden><button type="button" class="tab" id="moreBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lmenu">More lists ▾</button>
      <div class="lmenu" id="lmenu" hidden><label hidden><input type="search" id="lmenuQ" placeholder="Find a list" aria-label="Find a list" autocomplete="off"></label>
      <div id="lmenuList" role="listbox" aria-label="Every list"></div></div></div>
    <a class="tab add" href="/lists/edit/#new">+ New list</a>
  </div>
  <p class="bystate"><label><input type="checkbox" id="byState"> Group by state</label></p>
  <div id="panels">
    <section role="tabpanel" id="p-starred" data-tab="starred" aria-labelledby="t-starred">
      <p class="sub" id="sum">&nbsp;</p>
      <div id="news"></div>
      <div id="bills"></div>
      <p id="none" hidden>No starred bills in this browser yet. Star a bill on the <a href="/">front page</a> or a state&rsquo;s page and it shows up here.</p>
      <section id="shareSec" hidden>
        <div class="panel" id="share"></div>
      </section>
    </section>
  </div>
  <details id="connectList" class="quietbox"><summary>Made a list on another device?</summary>
    <div class="row"><input type="text" id="listKey" autocomplete="off" placeholder="Paste the list's key" aria-label="The list's key">
    <button type="button" class="btn" id="listConnect">Connect</button></div><p class="muted err" id="listMsg"></p></details>
  <footer><a href="/about/">About</a> &middot; <a href="SUPPORT_URL">Support this site</a></footer>
</main>
<script>
/*common.js*/
/*embed.js*/
/*watchrules.js*/
/*onelist.js*/
/*named.js*/
</script>
<script>
const DEFAULT_TITLE = "Bills I'm following";
const today = () => new Date().toISOString().slice(0, 10);
let ITEMS = [];               // the starred bills: lookUp() plus {st, session, num, entry, key, on}
const REMOVED = new Map();    // bills unstarred on this page (in the rows below the frames), kept in view until it's reloaded
const MAX = 500;              // the most bills a shared list holds

// ---- Tabs: Starred, each list made here (list editor), each list followed (not one made here) ----
// Tab ids: "starred", "list:<slug>", "follow:<slug>". A starred bill is new until it's opened (its watch entry's `seen`,
// the one record every page reads: freshStar()). What a list's tab showed when last viewed in this browser is kept in
// abt:tabseen ({tab id: {bill key: its last action's date then}}): a bill added since, or with a newer action, is new.
// When a tab was last opened is kept in abt:yourbills:recent ({tab id: time}): with more than five lists, the strip shows
// the four opened most recently and a "More lists" menu of all of them.
const TAB_KEY = "abt:yourbills:tab", TSEEN = "abt:tabseen", RECENT = "abt:yourbills:recent";
function readSeen() { try { const o = JSON.parse(localStorage.getItem(TSEEN) || "{}"); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; } catch (e) { return {}; } }
function writeSeen(o) { try { localStorage.setItem(TSEEN, JSON.stringify(o)); } catch (e) {} }
function readRecent() { try { const o = JSON.parse(localStorage.getItem(RECENT) || "{}"); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; } catch (e) { return {}; } }
const TABS = new Map();       // id -> {label, maker (a followed list's), count, fresh (how many new), rows ([{key, last}] once drawn), newKeys}
let CUR = "starred";
const domId = (id) => id.replace(/[^\w-]/g, "_");
const slugOf = (id) => id.replace(/^(?:list|follow):/, "");
const panelOf = (id) => $(`p-${domId(id)}`);
const SHOW_TABS = 4, MANY = 5, NAME_MAX = 40;
// A tab's name, cut only when it's longer than 40 characters.
const tabName = (t) => (t.length > NAME_MAX ? t.slice(0, NAME_MAX - 1).replace(/\s+\S*$/, "") + "…" : t);
// The lists this browser made never also show as followed.
function dropOwnFollows() {
  const f = readFollows();
  let changed = false;
  for (const slug of Object.keys(f)) if (editKeyFor(slug)) { delete f[slug]; changed = true; }
  if (changed) writeFollows(f);
}
function tabOrder() {
  const named = Object.values(readNamed()).sort((a, b) => (b.updated || "").localeCompare(a.updated || "")).map((l) => `list:${l.slug}`);
  return ["starred", ...named, ...Object.keys(readFollows()).filter((s) => !editKeyFor(s)).map((s) => `follow:${s}`)];
}
// A list tab's panel: its summary line, its introduction, its bills (each state's card, drawn by the state's page:
// embed.js) and, for a list made here, the key for another device.
const LIST_PANEL = '<p class="sub lmeta">Loading…</p><div class="lintro"></div><div class="sbills"></div><div class="lfoot"></div>';
// Makes a tab and an empty panel for each list, and drops those no longer kept.
function syncTabs() {
  dropOwnFollows();
  const ids = tabOrder(), named = readNamed(), f = readFollows();
  for (const id of ids) {
    const t = TABS.get(id) || { fresh: 0 };
    if (id === "starred") t.label = "Starred";
    else if (id.startsWith("list:")) { const l = named[slugOf(id)]; t.label = l.title || "Untitled list"; t.count = (l.bills || []).length; }
    else { const w = f[slugOf(id)] || {}; t.label = w.title || "A shared list"; t.maker ??= w.group || ""; if (t.count == null && w.known) t.count = w.known.length; }
    TABS.set(id, t);
    if (!panelOf(id)) {
      const p = document.createElement("section");
      p.setAttribute("role", "tabpanel"); p.id = `p-${domId(id)}`; p.dataset.tab = id; p.setAttribute("aria-labelledby", `t-${domId(id)}`);
      p.innerHTML = LIST_PANEL;
      $("panels").append(p);
    }
  }
  for (const id of [...TABS.keys()]) if (!ids.includes(id)) { TABS.delete(id); panelOf(id)?.remove(); }
  // In the tabs' order: starred, lists made here (newest change first), lists followed.
  const kept = new Map(TABS);
  TABS.clear();
  for (const id of ids) TABS.set(id, kept.get(id));
  // Panels in the tabs' order (for anyone reading the page without styles); only when they're out of order, since moving
  // a panel loads its frames again (moveBefore keeps them loaded).
  const order = ids.map(panelOf), box = $("panels");
  if (order.some((p, k) => box.children[k] !== p)) for (const p of order) (box.moveBefore ? box.moveBefore(p, null) : box.append(p));
  if (!TABS.has(CUR)) CUR = "starred";
  drawStrip();
}
// The tabs in the strip: all of them, or (more than five lists) Starred, the four lists opened most recently and the one in
// view, in the tabs' order.
function stripIds() {
  const ids = [...TABS.keys()], lists = ids.filter((id) => id !== "starred");
  if (lists.length <= MANY) return ids;
  const rec = readRecent(), recent = [...lists].sort((a, b) => (rec[b] || 0) - (rec[a] || 0) || lists.indexOf(a) - lists.indexOf(b)).slice(0, SHOW_TABS);
  if (CUR !== "starred" && !recent.includes(CUR)) recent[SHOW_TABS - 1] = CUR;
  return ids.filter((id) => id === "starred" || recent.includes(id));
}
const makerText = (t) => `Followed list${t.maker ? ` from ${t.maker}` : ""}`;
function tabHtml(id) {
  const t = TABS.get(id), on = id === CUR, follow = id.startsWith("follow:");
  const full = follow ? `${t.label}, ${makerText(t).toLowerCase()}` : t.label;
  return `<button type="button" class="tab" role="tab" id="t-${domId(id)}" data-tab="${esc(id)}" aria-controls="p-${domId(id)}" aria-selected="${on}" tabindex="${on ? 0 : -1}"`
    + ` aria-label="${esc(full)}${t.count != null ? ` (${t.count})` : ""}${t.fresh ? `, ${t.fresh} new` : ""}" title="${esc(follow ? `${t.label}\n${makerText(t)}` : t.label)}">`
    + (id === "starred" ? '<span aria-hidden="true">★</span> ' : "") + (follow ? '<span class="fmark" aria-hidden="true">↗</span> ' : "")
    + `<span class="tl">${esc(tabName(t.label))}</span>`
    + (t.count != null ? ` <span class="tc">(${t.count})</span>` : "") + (t.fresh ? `<span class="new">${t.fresh} new</span>` : "") + "</button>";
}
function drawStrip() {
  const ids = stripIds(), all = [...TABS.keys()], had = document.activeElement?.closest?.('[role="tab"]')?.dataset.tab;
  $("tablist").innerHTML = ids.map(tabHtml).join("");
  const hidden = all.length - ids.length, fresh = all.filter((id) => !ids.includes(id)).reduce((n, id) => n + (TABS.get(id).fresh || 0), 0);
  $("moreWrap").hidden = !hidden;
  $("moreBtn").innerHTML = `More lists (${all.length - 1}) ▾${fresh ? `<span class="new">${fresh} new</span>` : ""}`;
  if (!hidden) closeMenu();
  else if (!$("lmenu").hidden) drawMenu();
  for (const p of $("panels").children) p.hidden = p.dataset.tab !== CUR;
  if (had && ids.includes(had)) $(`t-${domId(had)}`)?.focus();
  edges();
}
// Fades the strip's edges where tabs are out of sight.
function edges() {
  const el = $("tablist"), over = el.scrollWidth - el.clientWidth;
  el.classList.toggle("more-l", over > 1 && el.scrollLeft > 1);
  el.classList.toggle("more-r", over > 1 && el.scrollLeft < over - 1);
}
$("tablist").addEventListener("scroll", edges, { passive: true });
addEventListener("resize", edges);
function select(id, how = {}) {
  if (!TABS.has(id)) id = "starred";
  CUR = id;
  try {
    localStorage.setItem(TAB_KEY, id);
    if (id !== "starred") localStorage.setItem(RECENT, JSON.stringify({ ...readRecent(), [id]: Date.now() }));
  } catch (e) {}
  if (how.user) history.replaceState(null, "", id === "starred" ? "#starred" : `#tab=${encodeURIComponent(slugOf(id))}`);
  drawStrip();
  const tab = $(`t-${domId(id)}`);
  if (how.focus) tab?.focus();
  tab?.scrollIntoView?.({ block: "nearest", inline: "nearest" });
  markSeen(id);
  if (how.user) countUse(`your-bills/tab ${id === "starred" ? "starred" : id.split(":")[0]}`);
}
// A tab's bills, once drawn: which are new, and seen now if it's the tab in view.
function loaded(id, rows, newKeys) {
  const t = TABS.get(id);
  if (!t) return;
  Object.assign(t, { rows, newKeys, fresh: newKeys.length });
  // (How many were new when the tab's bills came in: the Starred tab's summary line says when none were.)
  if (t.opened == null) t.opened = newKeys.length;
  if (id === CUR) markSeen(id); else drawStrip();
}
function markSeen(id) {
  const t = TABS.get(id);
  // (Starred bills are new until they're opened, here or anywhere: their watch entries say so, not this tab.)
  if (id === "starred") { if (t && t.rows) t.fresh = ITEMS.filter(freshStar).length; return drawStrip(); }
  if (!t || !t.rows || document.visibilityState === "hidden") return drawStrip();
  const s = readSeen();
  s[id] = Object.fromEntries(t.rows.map((r) => [r.key, r.last || today()]));
  writeSeen(s);
  if (id.startsWith("follow:")) {
    const f = readFollows(), slug = slugOf(id);
    if (f[slug]) { f[slug] = { ...f[slug], known: t.rows.map((r) => r.key) }; writeFollows(f); }
  }
  t.newKeys = []; t.fresh = 0;
  drawStrip();
}
// Shown later: a tab opened in the background counts as seen when it's looked at.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") markSeen(CUR); });
$("tablist").addEventListener("click", (e) => { const b = e.target.closest('[role="tab"]'); if (b) select(b.dataset.tab, { user: true }); });
$("tablist").addEventListener("keydown", (e) => {
  const ids = stripIds(), i = ids.indexOf(document.activeElement?.dataset?.tab);
  if (i < 0) return;
  if (e.key === "ArrowRight" && i === ids.length - 1 && !$("moreWrap").hidden) { e.preventDefault(); return $("moreBtn").focus(); }
  const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: ids.length - 1 }[e.key];
  if (to == null) return;
  e.preventDefault();
  select(ids[(to + ids.length) % ids.length], { user: true, focus: true });
});
// ---- "More lists": every list, in two groups, each with its new count; a search box when there are more than ten ----
function drawMenu() {
  const q = ($("lmenuQ")?.value || "").trim().toLowerCase(), all = [...TABS.keys()].filter((id) => id !== "starred");
  const hit = (id) => !q || TABS.get(id).label.toLowerCase().includes(q) || (TABS.get(id).maker || "").toLowerCase().includes(q);
  const item = (id) => { const t = TABS.get(id); return `<button type="button" role="option" tabindex="-1" data-pick="${esc(id)}" aria-selected="${id === CUR}">`
    + `<span class="ln">${id.startsWith("follow:") ? '<span class="fmark" aria-hidden="true">↗</span> ' : ""}${esc(t.label)}${id.startsWith("follow:") && t.maker ? ` <span class="muted">(${esc(t.maker)})</span>` : ""}</span>`
    + `${t.count != null ? `<span class="tc">${t.count}</span>` : ""}${t.fresh ? `<span class="new">${t.fresh} new</span>` : ""}</button>`; };
  const group = (name, ids) => (ids.length ? `<h4 id="lm-${name.replace(/\W/g, "")}">${name}</h4><div role="group" aria-labelledby="lm-${name.replace(/\W/g, "")}">${ids.map(item).join("")}</div>` : "");
  const mine = all.filter((id) => id.startsWith("list:") && hit(id)), fol = all.filter((id) => id.startsWith("follow:") && hit(id));
  $("lmenuList").innerHTML = group("Your lists", mine) + group("Lists you follow", fol) || '<p class="none">No list has that name.</p>';
  $("lmenuQ").parentElement.hidden = all.length <= 10;
}
function openMenu() {
  $("lmenu").hidden = false;
  $("moreBtn").setAttribute("aria-expanded", "true");
  drawMenu();
  ($("lmenuQ").parentElement.hidden ? $("lmenuList").querySelector('[role="option"]') : $("lmenuQ"))?.focus();
}
function closeMenu(refocus) {
  if ($("lmenu").hidden) return;
  $("lmenu").hidden = true;
  $("moreBtn").setAttribute("aria-expanded", "false");
  if ($("lmenuQ")) $("lmenuQ").value = "";
  if (refocus) $("moreBtn").focus();
}
$("moreBtn").addEventListener("click", () => ($("lmenu").hidden ? openMenu() : closeMenu()));
$("lmenuQ").addEventListener("input", drawMenu);
$("lmenu").addEventListener("click", (e) => {
  const b = e.target.closest("[data-pick]");
  if (!b) return;
  closeMenu();
  select(b.dataset.pick, { user: true, focus: true });
});
$("moreWrap").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); return closeMenu(true); }
  if (e.target === $("moreBtn")) {
    if (e.key === "ArrowLeft") { e.preventDefault(); const ids = stripIds(); return $(`t-${domId(ids[ids.length - 1])}`)?.focus(); }
    if (e.key === "ArrowDown") { e.preventDefault(); return openMenu(); }
    return;
  }
  if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) return;
  const opts = [...$("lmenuList").querySelectorAll('[role="option"]')], i = opts.indexOf(document.activeElement);
  e.preventDefault();
  const to = e.key === "Home" ? 0 : e.key === "End" ? opts.length - 1 : e.key === "ArrowDown" ? i + 1 : i - 1;
  if (to < 0 && !$("lmenuQ").parentElement.hidden) return $("lmenuQ").focus();
  opts[Math.max(0, Math.min(opts.length - 1, to))]?.focus();
});
document.addEventListener("click", (e) => { if (!e.target.closest("#moreWrap")) closeMenu(); });
// The tab a link names (#starred, #tab=<slug>), else the last one viewed here.
function tabFromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h === "starred") return "starred";
  const m = /^tab=(.+)$/.exec(h);
  if (!m) return "";
  const slug = m[1].trim();
  return TABS.has(`list:${slug}`) ? `list:${slug}` : TABS.has(`follow:${slug}`) ? `follow:${slug}` : "starred";
}
addEventListener("hashchange", () => { const id = tabFromHash(); if (id && id !== CUR) select(id); });
const NO_BILLS = '<p class="muted">No bills on it yet.</p>';

// ---- Starred bills: one list across states, what's due first (onelist.js) ----
// "Group by state" (kept in this browser) shows each state's bills together instead.
const BYSTATE = "abt:yourbills:bystate";
let BY_STATE = false;
try { BY_STATE = localStorage.getItem(BYSTATE) === "1"; } catch (e) {}
$("byState").checked = BY_STATE;
$("byState").addEventListener("change", () => {
  BY_STATE = $("byState").checked;
  try { localStorage.setItem(BYSTATE, BY_STATE ? "1" : "0"); } catch (e) {}
  countUse(`your-bills/by state ${BY_STATE ? "on" : "off"}`);
  redrawAll();
});
if (window.NamedLists) { NamedLists.setApi(LISTS_API); NamedLists.wire(); }
// The day of the last visit to the starred bills' states before today (each state's page keeps it: abt:<st>:visit, and
// abt:<st>:visitPrev once the day changes), the latest of them.
function lastVisit(sts) {
  const t = today(), days = [...sts].map((st) => {
    const k = `abt:${st}:`;
    try { const v = localStorage.getItem(k + "visit"); return v && v < t ? v : localStorage.getItem(k + "visitPrev") || ""; } catch (e) { return ""; }
  }).filter(Boolean).sort();
  return days.pop() || "";
}
const VISITED = lastVisit(new Set(allStarred().map((b) => b.st)));
function starSum() {
  const on = ITEMS.filter((x) => x.on), n = on.length, sts = new Set(on.map((x) => x.st));
  // (Once the statuses are in: nothing new on the tab when it opened.)
  const t0 = TABS.get("starred"), quiet = t0?.rows && !t0.opened ? ` · Nothing new${VISITED ? ` since ${fmtDay(VISITED)}` : ""}` : "";
  $("sum").innerHTML = n ? `${n} bill${n === 1 ? "" : "s"}${sts.size > 1 ? ` in ${sts.size} ${sts.has("us") ? "places" : "states"}` : ""}${quiet}` : "&nbsp;";
  $("sum").hidden = !n;
  const t = TABS.get("starred");
  if (t) { t.count = n; drawStrip(); }
}
// New: a starred bill whose newest action (not paperwork) came after it was last opened, here, on the front page or on
// its state's page. That's one record, the watch entry's `seen` (abt:<st>:watch), which opening the bill anywhere sets.
const entryNow = (x) => entryOf(readWatch(x.st)[`${x.session}:${x.num}`]);
// ("New": an action since the day last seen that isn't paperwork, decided as on every page: BillFacts.isNew().)
const freshStar = (x) => !!(x.on !== false && x.found && BillFacts.isNew(entryNow(x).seen, x.news ?? x.last));
// A starred bill opened, or "Mark all as seen": its entry's `seen` becomes its last action's day.
function seeStar(x) {
  const w = readWatch(x.st), k = `${x.session}:${x.num}`;
  if (!w[k] || !x.last) return;
  const e = entryOf(w[k]);
  if ((e.seen || "") >= x.last) return;
  w[k] = { ...e, seen: x.last };
  writeWatch(x.st, w);
}
// "New since you last looked", at the top (watchrows.js's box, as on each state's Watchlist tab).
function drawNews() {
  const fresh = ITEMS.filter(freshStar).sort((a, b) => String(b.last).localeCompare(String(a.last)));
  $("news").innerHTML = WatchRows.newsHtml(fresh.map((x) => ({ key: x.key, kind: x.stage === 5 ? "ok" : x.stage === 6 ? "no" : "", what: plainAct(x.action || ""),
    num: `${x.st === "us" ? "" : `${stName(x.st)} `}${WatchRows.numText(x.st, x.full || x.num)}`, title: x.title, date: fmtDay(x.last) })));
  const t = TABS.get("starred");
  if (t) { t.fresh = fresh.length; drawStrip(); }
}
$("news").addEventListener("click", (e) => {
  if (e.target.closest("[data-wseenall]")) { for (const x of ITEMS.filter(freshStar)) seeStar(x); countUse("your-bills/marked all seen"); drawStarred(ITEMS); drawNews(); return; }
  const n = e.target.closest("[data-wnews]");
  if (!n) return;
  const id = WatchRows.idOf({ tab: "s" }, { key: n.dataset.wnews });
  if (BY_STATE || !document.querySelector(`button.rowbtn[data-open="${CSS.escape(id)}"]`)) return;
  if (document.querySelector(`button.rowbtn[data-open="${CSS.escape(id)}"]`).getAttribute("aria-expanded") !== "true") { Opener.open(id); opened(id); }
  n.classList.add("read");
  document.querySelector(`button.rowbtn[data-open="${CSS.escape(id)}"]`).closest("li").scrollIntoView({ behavior: "smooth", block: "start" });
});
// A starred bill's row opened: seen (its card, drawn by its state's page, marks it seen there too).
function opened(id) {
  const x = $("bills")._rows?.get(id) && ITEMS.find((i) => i.key === $("bills")._rows.get(id).key);
  if (!x) return;
  seeStar(x);
  document.querySelector(`button.rowbtn[data-open="${CSS.escape(id)}"] .wr-new`)?.remove();
  $("news").querySelector(`[data-wnews="${CSS.escape(x.key)}"]`)?.classList.add("read");
  const t = TABS.get("starred");
  if (t) { t.fresh = ITEMS.filter(freshStar).length; drawStrip(); }
}
function drawStarred(list) {
  OneList.draw($("bills"), list, { tab: "s", byState: BY_STATE, isNew: freshStar, remove: true, mine: true, onOpen: (id) => opened(id) });
}

    `<span class="lmsg muted" data-msg="${esc(slug)}"></span>`].filter(Boolean).join("");

  if (!slug || !key) return (msg.textContent = "Paste the key exactly as it was copied: a name, a space and a code.");
  try {
    await api(`/lists/${encodeURIComponent(slug)}/views`, { headers: { "X-Edit-Key": key } });
    const w = await api(`/lists/${encodeURIComponent(slug)}`, { headers: { "X-Edit-Key": key } });
    if (w.state !== "all") return (msg.textContent = `That key is for a list shared from ${stName(w.state)}'s watchlist; use it there.`);
    const p = { title: w.title || "", bills: w.bills, intro: w.intro || "", notes: w.notes || {} };
    const all = readNamed();
    all[slug] = { slug, editKey: key, ...p, group: w.group || "", saved: JSON.stringify([p.title, p.bills, p.intro, p.notes]), updated: w.updated };
    writeNamed(all);
    $("listKey").value = ""; msg.textContent = ""; $("connectList").open = false;
    countUse("your-bills/connected a list");
    syncTabs();
    await drawList(all[slug]);
    select(`list:${slug}`, { user: true, focus: true });
  } catch (err) { msg.textContent = err.message; }
});

// A change in another tab (a star on a state's page, a list edited or followed): redraw, and keep the shared list in step.
addEventListener("storage", (e) => {
  if (/^abt:([a-z]{2}):watch$/.test(e.key || "")) { draw(); redrawAll(); }
  if (e.key === NAMED || e.key === PUB) { syncTabs(); drawLists(); }
  if (e.key === FOLLOWS) {
    const had = new Set([...TABS.keys()]);
    syncTabs();
    for (const id of TABS.keys()) if (!had.has(id) && id.startsWith("follow:")) drawFollow(slugOf(id));
  }
});
syncTabs();
select(tabFromHash() || "starred");  // (not the tab last viewed: "Open as a page" from the front page means your starred bills)
draw();
drawLists();
refreshLists();
drawFollows();
countOnce("your-bills/opened");
</script>
</body>
