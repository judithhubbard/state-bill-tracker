<!DOCTYPE html>
<!-- "Your bills" (/your-bills/): a tab for the bills starred in this browser (in any state or Congress, grouped by state),
     one for each list made here with the list editor, and one for each list this browser follows. A visitor can share the
     starred bills as one live list (lists_worker/, a list across states) that this page keeps in step with the stars.
     build_site.sh writes it to your-bills/index.html, putting common.css and common.js in place of their comments, the link
     preview tags and visit counter in place of the meta comment, and the addresses of the lists Worker (LISTS_API_URL) and
     the contributions page (SUPPORT_URL). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your bills · State Bill Tracker</title>
<meta name="description" content="The bills you follow in every state and Congress: where each one is and what's new.">
<meta name="robots" content="noindex">
<!--meta-->
<meta name="lists-api" content="LISTS_API_URL">
<meta name="support" content="SUPPORT_URL">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Where each bill is: the index of the status pieces (common.js's statusOf()), wanted before the script runs. -->
<link rel="preload" href="/status.json" as="fetch" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/*common.css*/
.grp { font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<main>
  <p class="back"><a href="/">&larr; State Bill Tracker</a></p>
  <h1>Your bills</h1>
  <div class="tabbar">
    <div role="tablist" id="tablist" aria-label="Your lists"></div>
    <a class="tab add" href="/lists/edit/#new">+ New list</a>
  </div>
  <div id="panels">
    <section role="tabpanel" id="p-starred" data-tab="starred" aria-labelledby="t-starred">
      <p class="sub" id="sum">&nbsp;</p>
      <div id="bills"></div>
      <p id="none" hidden>No starred bills in this browser yet. Star a bill on the <a href="/">front page</a> or a state&rsquo;s page and it shows up here.</p>
      <section id="shareSec" hidden>
        <h2>Share these</h2>
        <div class="panel" id="share"></div>
      </section>
    </section>
  </div>
  <details id="connectList" class="quietbox"><summary>Made a list on another device?</summary>
    <div class="row"><input type="text" id="listKey" autocomplete="off" placeholder="Paste the list's key" aria-label="The list's key">
    <button type="button" class="btn" id="listConnect">Connect</button></div><p class="muted err" id="listMsg"></p></details>
  <footer><a href="/about/">About</a> &middot; <a href="SUPPORT_URL">Support this site</a></footer>
</main>
<script>
/*common.js*/
</script>
<script>
const DEFAULT_TITLE = "Bills I'm following";
const today = () => new Date().toISOString().slice(0, 10);
let ITEMS = [];               // the starred bills as drawn: lookUp() plus {st, session, num, entry, key}
const REMOVED = new Map();    // bills unstarred on this page, kept in view (with an empty star) until it's reloaded
const MAX = 500;              // the most bills a shared list holds

// ---- Tabs: Starred, each list made here (list editor), each list followed (not one made here) ----
// Tab ids: "starred", "list:<slug>", "follow:<slug>". What each tab showed when last viewed in this browser is kept in
// abt:tabseen ({tab id: {bill key: its last action's date then}}): a bill added since, or with a newer action, is new.
const TAB_KEY = "abt:yourbills:tab", TSEEN = "abt:tabseen";
function readSeen() { try { const o = JSON.parse(localStorage.getItem(TSEEN) || "{}"); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; } catch (e) { return {}; } }
function writeSeen(o) { try { localStorage.setItem(TSEEN, JSON.stringify(o)); } catch (e) {} }
const TABS = new Map();       // id -> {label, count, fresh (how many new), rows ([{key, last}] once drawn), newKeys}
const SHOWN = {};             // id -> bill keys that were new when the tab was viewed on this page (they stay marked New)
let CUR = "starred";
const domId = (id) => id.replace(/[^\w-]/g, "_");
const slugOf = (id) => id.replace(/^(?:list|follow):/, "");
const panelOf = (id) => $(`p-${domId(id)}`);
// The lists this browser made never also show as followed.
function dropOwnFollows() {
  const f = readFollows();
  let changed = false;
  for (const slug of Object.keys(f)) if (editKeyFor(slug)) { delete f[slug]; changed = true; }
  if (changed) writeFollows(f);
}
function tabOrder() {
  const named = Object.values(readNamed()).sort((a, b) => (b.updated || "").localeCompare(a.updated || "")).map((l) => `list:${l.slug}`);
  return ["starred", ...named, ...Object.keys(readFollows()).filter((s) => !editKeyFor(s)).map((s) => `follow:${s}`)];
}
// Makes a tab and an empty panel for each list, and drops those no longer kept.
function syncTabs() {
  dropOwnFollows();
  const ids = tabOrder(), named = readNamed(), f = readFollows();
  for (const id of ids) {
    const t = TABS.get(id) || { fresh: 0 };
    if (id === "starred") t.label = "Starred";
    else if (id.startsWith("list:")) { const l = named[slugOf(id)]; t.label = l.title || "Untitled list"; t.count = (l.bills || []).length; }
    else { const w = f[slugOf(id)] || {}; t.label = w.title || "A shared list"; if (t.count == null && w.known) t.count = w.known.length; }
    TABS.set(id, t);
    if (!panelOf(id)) {
      const p = document.createElement("section");
      p.setAttribute("role", "tabpanel"); p.id = `p-${domId(id)}`; p.dataset.tab = id; p.setAttribute("aria-labelledby", `t-${domId(id)}`);
      p.innerHTML = '<p class="muted">Loading…</p>';
      $("panels").append(p);
    }
  }
  for (const id of [...TABS.keys()]) if (!ids.includes(id)) { TABS.delete(id); panelOf(id)?.remove(); }
  // In the tabs' order: starred, lists made here (newest change first), lists followed.
  const kept = new Map(TABS);
  TABS.clear();
  for (const id of ids) TABS.set(id, kept.get(id));
  // Panels in the tabs' order (for anyone reading the page without styles).
  for (const id of ids) $("panels").append(panelOf(id));
  if (!TABS.has(CUR)) CUR = "starred";
  drawStrip();
}
function drawStrip() {
  const ids = [...TABS.keys()], had = document.activeElement?.closest?.('[role="tab"]')?.dataset.tab;
  $("tablist").innerHTML = ids.map((id) => {
    const t = TABS.get(id), on = id === CUR;
    return `<button type="button" class="tab" role="tab" id="t-${domId(id)}" data-tab="${esc(id)}" aria-controls="p-${domId(id)}" aria-selected="${on}" tabindex="${on ? 0 : -1}">`
      + (id === "starred" ? '<span aria-hidden="true">★</span> ' : "") + `<span class="tl">${esc(t.label)}</span>`
      + (t.count != null ? ` <span class="tc">(${t.count})</span>` : "") + (t.fresh ? `<span class="new">${t.fresh} new</span>` : "") + "</button>";
  }).join("");
  for (const p of $("panels").children) p.hidden = p.dataset.tab !== CUR;
  if (had && TABS.has(had)) $(`t-${domId(had)}`)?.focus();
  edges();
}
// Fades the strip's edges where tabs are out of sight.
function edges() {
  const el = $("tablist"), over = el.scrollWidth - el.clientWidth;
  el.classList.toggle("more-l", over > 1 && el.scrollLeft > 1);
  el.classList.toggle("more-r", over > 1 && el.scrollLeft < over - 1);
}
$("tablist").addEventListener("scroll", edges, { passive: true });
addEventListener("resize", edges);
function select(id, how = {}) {
  if (!TABS.has(id)) id = "starred";
  CUR = id;
  try { localStorage.setItem(TAB_KEY, id); } catch (e) {}
  if (how.user) history.replaceState(null, "", id === "starred" ? "#starred" : `#tab=${encodeURIComponent(slugOf(id))}`);
  drawStrip();
  const tab = $(`t-${domId(id)}`);
  if (how.focus) tab?.focus();
  tab?.scrollIntoView?.({ block: "nearest", inline: "nearest" });
  markSeen(id);
  if (how.user) countUse(`your-bills/tab ${id === "starred" ? "starred" : id.split(":")[0]}`);
}
// A tab's bills, once drawn: which are new, and seen now if it's the tab in view.
function loaded(id, rows, newKeys) {
  const t = TABS.get(id);
  if (!t) return;
  Object.assign(t, { rows, newKeys, fresh: newKeys.length });
  if (id === CUR) markSeen(id); else drawStrip();
}
function markSeen(id) {
  const t = TABS.get(id);
  if (!t || !t.rows || document.visibilityState === "hidden") return drawStrip();
  for (const k of t.newKeys) (SHOWN[id] ||= new Set()).add(k);
  const s = readSeen();
  s[id] = Object.fromEntries(t.rows.map((r) => [r.key, r.last || today()]));
  writeSeen(s);
  if (id.startsWith("follow:")) {
    const f = readFollows(), slug = slugOf(id);
    if (f[slug]) { f[slug] = { ...f[slug], known: t.rows.map((r) => r.key) }; writeFollows(f); }
  }
  t.newKeys = []; t.fresh = 0;
  drawStrip();
}
// Shown later: a tab opened in the background counts as seen when it's looked at.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") markSeen(CUR); });
$("tablist").addEventListener("click", (e) => { const b = e.target.closest('[role="tab"]'); if (b) select(b.dataset.tab, { user: true }); });
$("tablist").addEventListener("keydown", (e) => {
  const ids = [...TABS.keys()], i = ids.indexOf(document.activeElement?.dataset?.tab);
  if (i < 0) return;
  const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: ids.length - 1 }[e.key];
  if (to == null) return;
  e.preventDefault();
  select(ids[(to + ids.length) % ids.length], { user: true, focus: true });
});
// The tab a link names (#starred, #tab=<slug>), else the last one viewed here.
function tabFromHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h === "starred") return "starred";
  const m = /^tab=(.+)$/.exec(h);
  if (!m) return "";
  const slug = m[1].trim();
  return TABS.has(`list:${slug}`) ? `list:${slug}` : TABS.has(`follow:${slug}`) ? `follow:${slug}` : "starred";
}
addEventListener("hashchange", () => { const id = tabFromHash(); if (id && id !== CUR) select(id); });

// A state's bills: a card for each state, newest changes first.
function byState(rows, wl, row) {
  const by = {};
  for (const x of rows) (by[x.st] ||= []).push(x);
  return Object.keys(by).sort((a, b) => stName(a).localeCompare(stName(b))).map((st) => {
    const rs = by[st].sort((a, b) => (b.fresh - a.fresh) || (b.last || "").localeCompare(a.last || ""));
    return `<div class="mst"><h3><a href="/${st}/">${esc(stName(st))}</a>${wl ? `<a class="wl" href="/${st}/watchlist/">Watchlist ›</a>` : ""}</h3><ol>`
      + rs.map(row).join("") + "</ol></div>";
  }).join("");
}
const NO_BILLS = '<p class="muted">No bills on it yet.</p>';

// ---- Starred bills ----
const starBtn = (x, on) => `<button type="button" class="star" data-star="${esc(x.key)}" aria-pressed="${on}" aria-label="${on ? "Remove" : "Star"} ${esc(numText(x.st, x.full))}" title="${on ? "Remove from your bills" : "Star it again"}">${on ? "★" : "☆"}</button>`;
function starSum() {
  const on = ITEMS.filter((x) => x.on), n = on.length, sts = new Set(on.map((x) => x.st)), fresh = on.filter((x) => x.fresh).length;
  $("sum").innerHTML = n ? `${n} bill${n === 1 ? "" : "s"}${sts.size > 1 ? ` in ${sts.size} ${sts.has("us") ? "places" : "states"}` : ""}${fresh ? ` · <b>${fresh} new</b>` : ""}` : "&nbsp;";
  $("sum").hidden = !n;
  const t = TABS.get("starred");
  if (t) { t.count = n; drawStrip(); }
}
async function draw() {
  syncTabs();
  const starred = allStarred().map((b) => ({ ...b, key: crossKey(b.st, b.session, b.num) }));
  const keys = new Set(starred.map((b) => b.key));
  for (const [k, b] of REMOVED) if (!keys.has(k)) starred.push(b); else REMOVED.delete(k);
  ITEMS = await Promise.all(starred.map(async (b) => {
    const s = await lookUp(b.st, b.session, b.num), on = !REMOVED.has(b.key), seen = b.entry.seen || "";
    const fresh = on && s.found && s.last && s.last > seen;
    return { ...b, ...s, on, fresh, newLine: fresh && s.action ? plainAct(s.action) : "", stance: b.entry.stance === "oppose" ? "oppose" : "",
      seen: s.found ? `${b.st}|${b.session}:${b.num}|${s.last || ""}` : "" };
  }));
  $("bills").innerHTML = byState(ITEMS, true, (x) => billRow({ ...x, star: starBtn(x, x.on) }));
  $("none").hidden = ITEMS.length > 0;
  $("shareSec").hidden = !ITEMS.length && !myList();
  starSum();
  drawShare();
  // New on the tab: a bill whose newest action came after it was last opened, and after this tab was last viewed.
  const rec = readSeen().starred, on = ITEMS.filter((x) => x.on);
  loaded("starred", on.map((x) => ({ key: x.key, last: x.last })), on.filter((x) => x.fresh && !(rec && rec[x.key] && rec[x.key] >= x.last)).map((x) => x.key));
}
$("bills").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-star]");
  if (!b) return;
  e.preventDefault();
  const x = ITEMS.find((i) => i.key === b.dataset.star);
  if (!x) return;
  const w = readWatch(x.st), k = `${x.session}:${x.num}`;
  if (k in w) { delete w[k]; REMOVED.set(x.key, x); countUse("your-bills/unstarred"); }
  else { w[k] = { ...x.entry, seen: x.entry.seen || x.last || today() }; REMOVED.delete(x.key); }
  writeWatch(x.st, w);
  x.on = !x.on;
  b.outerHTML = starBtn(x, x.on);
  starSum();
  schedule();
});
// Opening a bill marks it seen, as opening it on the state's page does.
$("panels").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-seen]");
  if (!a) return;
  const [st, k, last] = a.dataset.seen.split("|"), w = readWatch(st);
  if (w[k]) { w[k] = { ...entryOf(w[k]), seen: last }; writeWatch(st, w); }
  countUse("your-bills/opened a bill");
});

// ---- Sharing: one live list across states, saved a minute after the stars change ----
// What the shared list should hold now.
function payload(mine) {
  const bills = ITEMS.filter((x) => x.on).map((x) => (x.stance === "oppose" ? "-" : "") + x.key).filter((c) => CROSS_RE.test(c)).sort((a, b) => a.replace(/^-/, "").localeCompare(b.replace(/^-/, ""))).slice(0, MAX);
  const keep = new Set(bills.map((c) => c.replace(/^-/, "")));
  const notes = {};
  if (mine?.group) for (const [k, v] of Object.entries(mine.notes || {})) if (keep.has(k) && String(v).trim()) notes[k] = String(v).trim();
  return { state: "all", title: (mine?.title || "").trim() || DEFAULT_TITLE, bills, intro: mine?.group ? (mine.intro || "").trim() : "", notes };
}
const sig = (p) => JSON.stringify([p.title, p.bills, p.intro, p.notes]);
let TIMER = null;
const say = (t, bad) => { const el = $("saved"); if (el) { el.textContent = t; el.classList.toggle("err", !!bad); } };
function schedule(ms = 60e3) {
  const mine = myList();
  if (!mine) return;
  clearTimeout(TIMER); TIMER = null;
  if (sig(payload(mine)) === mine.saved) return say("The shared list is up to date.");
  TIMER = setTimeout(save, ms);
  say("Your changes will show on the shared list in a minute.");
}
async function save() {
  TIMER = null;
  const mine = myList();
  if (!mine) return;
  const p = payload(mine), s = sig(p);
  if (s === mine.saved) return say("The shared list is up to date.");
  say("Saving…");
  try {
    await api(`/lists/${encodeURIComponent(mine.slug)}`, { method: "PUT", headers: { "X-Edit-Key": mine.editKey }, body: JSON.stringify(p) });
    setMyList({ ...myList(), saved: s });
    say("The shared list is up to date.");
  } catch (e) {
    if (e.status === 429) { TIMER = setTimeout(save, 15e3); return; }
    if (e.status === 404) { setMyList(null); drawShare(true); return say("That shared list isn't online any more.", true); }
    say(e.message, true);
  }
}
// Leaving the page with a save still waiting: send it now.
addEventListener("pagehide", () => {
  const mine = myList();
  if (!TIMER || !mine || !LISTS_API) return;
  clearTimeout(TIMER); TIMER = null;
  const p = payload(mine);
  try {
    fetch(`${LISTS_API}/lists/${encodeURIComponent(mine.slug)}`, { method: "PUT", keepalive: true, headers: { "Content-Type": "application/json", "X-Edit-Key": mine.editKey }, body: JSON.stringify(p) });
    setMyList({ ...mine, saved: sig(p) });
  } catch (e) {}
});
const CODE_LINE = `<p class="muted">Sharing for an organization? <a href="mailto:statebilltracker@gmail.com?subject=${encodeURIComponent("Group code for State Bill Tracker")}">Ask for a group code</a>`
  + ` &middot; <button type="button" class="linkish" data-act="havecode">I have one</button></p>`
  + `<div class="row" id="codeRow" hidden><input type="text" id="codeName" maxlength="120" placeholder="List name" aria-label="List name">`
  + `<input type="text" id="code" autocomplete="off" placeholder="Group code" aria-label="Group code"><button type="button" class="btn" data-act="code">Use it</button></div>`;
let THANKS = "";
function drawShare(keepMsg) {
  const mine = myList(), el = $("share"), msg = keepMsg ? $("saved")?.textContent || "" : "";
  if (!mine) {
    el.innerHTML = `<p>One link that always shows these bills, kept up to date as you star and unstar them.</p>`
      + `<p class="row"><button type="button" class="btn primary" data-act="share"${ITEMS.some((x) => x.on) ? "" : " disabled"}>Share these</button> <span class="muted" id="saved"></span></p>`
      + CODE_LINE
      + `<details><summary>Shared these from another device?</summary><div class="row"><input type="text" id="pasteKey" autocomplete="off" placeholder="Paste the list's key" aria-label="The list's key">`
      + `<button type="button" class="btn" data-act="connect">Connect</button></div></details>`;
    if (msg) say(msg, true);
    return;
  }
  const url = listLink(mine.slug), group = !!mine.group;
  el.innerHTML = (group ? `<p class="muted">${esc(mine.group)}&rsquo;s list</p>` : "")
    + `<label>Name<input type="text" id="title" maxlength="${group ? 120 : 60}" value="${esc(mine.title || "")}" placeholder="${esc(DEFAULT_TITLE)}"></label>`
    + (group ? `<label>Introduction<textarea id="intro" rows="3" maxlength="3000" placeholder="Why these bills matter">${esc(mine.intro || "")}</textarea></label>`
      + `<details id="notesBox"><summary>Notes on each bill</summary><div id="notes"></div></details>` : "")
    + `<div class="row"><input type="text" readonly value="${esc(url)}" aria-label="Link to the shared list" id="link"><button type="button" class="btn" data-act="copy">Copy link</button></div>`
    + `<div class="row">${shareIcons(url, mine.title || DEFAULT_TITLE)}<a class="muted" href="/list/#${esc(mine.slug)}">Preview</a></div>`
    + `<p class="muted" id="saved"></p>`
    + (THANKS ? `<p class="thanks">${THANKS}</p>` : "")
    + (group ? "" : CODE_LINE)
    + `<details><summary>Use this list on another device</summary><p class="muted">Paste this key into Your bills on the other device. Anyone with it can change the list.</p>`
    + `<div class="row"><input type="text" readonly id="key" value="${esc(`${mine.slug} ${mine.editKey}`)}" aria-label="The list's key"><button type="button" class="btn" data-act="copykey">Copy</button></div></details>`
    + `<p class="row"><button type="button" class="btn quiet" data-act="stop">Stop sharing</button></p>`;
  if (group) drawNotes(mine);
  schedule(TIMER ? 60e3 : 2e3);
}
function drawNotes(mine) {
  const el = $("notes");
  if (!el) return;
  el.innerHTML = ITEMS.filter((x) => x.on).map((x) => `<label>${esc(stName(x.st))} ${esc(numText(x.st, x.full))}: ${esc(x.title)}`
    + `<textarea rows="2" maxlength="1000" data-note="${esc(x.key)}">${esc((mine.notes || {})[x.key] || "")}</textarea></label>`).join("");
}
// Adds a shared list's bills to this browser's watchlists (connecting another device).
function adopt(l) {
  for (const b of listBills(l)) {
    const w = readWatch(b.st), k = `${b.session}:${b.num}`;
    if (!(k in w)) { w[k] = { seen: today(), stance: b.stance }; writeWatch(b.st, w); }
  }
}
$("share").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, mine = myList();
  try {
    if (act === "copy") { countUse("your-bills/link copied"); return copy(b, listLink(mine.slug)); }
    if (act === "copykey") return copy(b, `${mine.slug} ${mine.editKey}`);
    if (act === "havecode") { $("codeRow").hidden = false; $("codeName").value = mine?.title || ""; $("codeName").focus(); return; }
    if (act === "share") {
      b.disabled = true; say("Sharing…");
      const p = payload(null), r = await api("/lists", { method: "POST", body: JSON.stringify(p) });
      setMyList({ slug: r.slug, editKey: r.editKey, title: "", group: "", intro: "", notes: {}, saved: sig(p) });
      countUse("your-bills/shared");
      THANKS = thanksOnce();
      return drawShare();
    }
    if (act === "code") {
      const code = $("code").value.trim(), title = $("codeName").value.trim();
      if (!code) return say("Enter the group code.", true);
      if (!title) return say("Give the list a name; it becomes part of its address.", true);
      say("Sharing…");
      const p = payload({ ...(mine || {}), title, group: "x" }), r = await api("/lists", { method: "POST", body: JSON.stringify({ ...p, code }) });
      if (mine) await api(`/lists/${encodeURIComponent(mine.slug)}`, { method: "DELETE", headers: { "X-Edit-Key": mine.editKey } }).catch(() => {});
      setMyList({ slug: r.slug, editKey: r.editKey, title, group: r.group, intro: p.intro, notes: p.notes, saved: sig(p) });
      countUse("your-bills/shared for a group");
      if (!mine) THANKS = thanksOnce();
      return drawShare();
    }
    if (act === "connect") {
      const [slug, key] = $("pasteKey").value.trim().split(/\s+/);
      if (!slug || !key) return say("Paste the key exactly as it was copied: a name, a space and a code.", true);
      await api(`/lists/${encodeURIComponent(slug)}/views`, { headers: { "X-Edit-Key": key } });
      const l = await api(`/lists/${encodeURIComponent(slug)}`, { headers: { "X-Edit-Key": key } });
      if (l.state !== "all") return say(`That key is for a list shared from ${stName(l.state)}'s watchlist; use it there.`, true);
      adopt(l);
      const p = { title: l.title, bills: l.bills, intro: l.intro || "", notes: l.notes || {} };
      setMyList({ slug, editKey: key, title: l.title === DEFAULT_TITLE ? "" : l.title, group: l.group, intro: p.intro, notes: p.notes, saved: sig(p) });
      countUse("your-bills/connected");
      return draw();
    }
    if (act === "stop") {
      if (!confirm("Stop sharing? The link will stop working for everyone.")) return;
      clearTimeout(TIMER); TIMER = null;
      await api(`/lists/${encodeURIComponent(mine.slug)}`, { method: "DELETE", headers: { "X-Edit-Key": mine.editKey } }).catch((err) => { if (err.status !== 404) throw err; });
      setMyList(null); THANKS = "";
      countUse("your-bills/stopped sharing");
      return drawShare();
    }
  } catch (err) { b.disabled = false; say(err.message, true); }
});
$("share").addEventListener("input", (e) => {
  const mine = myList();
  if (!mine) return;
  if (e.target.id === "title") mine.title = e.target.value;
  else if (e.target.id === "intro") mine.intro = e.target.value;
  else if (e.target.dataset.note) mine.notes = { ...(mine.notes || {}), [e.target.dataset.note]: e.target.value };
  else return;
  setMyList(mine);
  schedule();
});
$("share").addEventListener("click", (e) => { const a = e.target.closest("a[data-share]"); if (a) countUse(`your-bills/share by ${a.dataset.share}`); });

// ---- Lists made with the list editor (/lists/edit/), each with its own link ----
// New on its tab: a bill with an action since the tab was last viewed (bills added here aren't news to their maker).
const GONE = new Set();     // lists the Worker no longer has
async function drawList(l) {
  const id = `list:${l.slug}`, p = panelOf(id);
  if (!p) return;
  const title = l.title || "Untitled list";
  if (GONE.has(l.slug)) {
    p.innerHTML = `<p class="sub">This list isn&rsquo;t online any more.</p><p class="row"><button type="button" class="btn quiet" data-forget="${esc(l.slug)}">Remove it</button></p>`;
    return loaded(id, [], []);
  }
  const bills = (l.bills || []).map(parseCross).filter(Boolean), stance = !!l.group || (l.bills || []).some((c) => c.startsWith("-"));
  const s = readSeen(), rec = s[id] || {};
  const rows = await Promise.all(bills.map(async (b) => {
    const x = await lookUp(b.st, b.session, b.num), was = rec[b.key];
    const isNew = !!(was && x.last && x.last > was);
    return { ...b, ...x, isNew, stance: stance ? b.stance : "", note: (l.notes || {})[b.key] || "" };
  }));
  // Bills not seen on this tab before start from where they are now.
  if (rows.some((x) => !(x.key in rec))) {
    const now = readSeen();
    now[id] = { ...(now[id] || {}), ...Object.fromEntries(rows.filter((x) => !(x.key in rec)).map((x) => [x.key, x.last || today()])) };
    writeSeen(now);
  }
  const n = rows.length, url = listLink(l.slug);
  const meta = [l.group, `${n} bill${n === 1 ? "" : "s"}`, l.updated ? `changed ${fmtDay(l.updated.slice(0, 10))}` : ""].filter(Boolean).join(" · ");
  p.innerHTML = `<p class="sub">${esc(meta)} · <a href="/list/#${esc(l.slug)}">Preview</a></p>`
    + `<div class="row"><a class="btn" href="/lists/edit/#${esc(l.slug)}">Edit</a><button type="button" class="btn" data-copylist="${esc(l.slug)}">Copy link</button>${shareIcons(url, title)}</div>`
    + (rows.length ? byState(rows.map((x) => listRow(id, x)), false, billRow) : NO_BILLS)
    + `<details class="quietbox"><summary>Use this list on another device</summary><p class="muted">Paste this key into Your bills on the other device. Anyone with it can change the list.</p>`
    + `<div class="row"><input type="text" readonly value="${esc(`${l.slug} ${l.editKey}`)}" aria-label="The list's key"><button type="button" class="btn" data-copykey="${esc(l.slug)}">Copy</button></div></details>`;
  loaded(id, rows.map((x) => ({ key: x.key, last: x.last })), rows.filter((x) => x.isNew).map((x) => x.key));
}
// A list's row: marked New when it was new on this tab when the tab was viewed here.
function listRow(id, x) {
  const fresh = x.isNew || x.added || !!SHOWN[id]?.has(x.key);
  return { ...x, fresh, newLine: fresh && !x.added && x.action ? plainAct(x.action) : "" };
}
function drawLists() { return Promise.all(Object.values(readNamed()).map(drawList)); }
// The Worker's copy may be newer (changed on another device): take its bills and name, unless this browser has changes
// still to save (the editor sends them next time it's opened).
async function refreshLists() {
  const sigOf = (p) => JSON.stringify([p.title, p.bills, p.intro, p.notes]);
  await Promise.all(Object.values(readNamed()).map(async (l) => {
    try {
      const w = await api(`/lists/${encodeURIComponent(l.slug)}`, { headers: { "X-Edit-Key": l.editKey } });
      const now = readNamed(), mine = now[l.slug];
      if (!mine || w.state !== "all") return;
      const p = { title: w.title || "", bills: w.bills, intro: w.intro || "", notes: w.notes || {} };
      if (sigOf(p) === mine.saved) return;
      const local = { title: (mine.title || "").trim(), bills: mine.bills || [], intro: mine.group ? (mine.intro || "").trim() : "", notes: mine.notes || {} };
      if (mine.saved && sigOf(local) !== mine.saved) return;
      now[l.slug] = { ...mine, ...p, group: w.group || "", saved: sigOf(p), updated: w.updated || mine.updated };
      writeNamed(now);
    } catch (e) { if (e.status === 404) GONE.add(l.slug); }
  }));
  syncTabs();
  await drawLists();
}

// ---- Lists this browser follows (Follow on /list/) ----
// New on its tab: a bill added to the list, or with an action, since the tab was last viewed (before this page kept
// that: a bill added since it was followed).
async function drawFollow(slug) {
  const id = `follow:${slug}`, p = panelOf(id);
  if (!p) return;
  const was = readFollows()[slug] || {};
  let l;
  try { l = await api(`/lists/${encodeURIComponent(slug)}`); }
  catch (e) {
    p.innerHTML = (e.status === 404 ? `<p class="sub">This list isn&rsquo;t online any more.</p>` : `<p class="sub">Couldn&rsquo;t load it just now.</p>`)
      + `<p class="row"><button type="button" class="btn quiet" data-unfollow="${esc(slug)}">Unfollow</button></p>`;
    return;
  }
  if (!panelOf(id)) return;
  const known = new Set(was.known || []), rec = readSeen()[id], bills = listBills(l);
  const rows = await Promise.all(bills.map(async (b) => {
    const s = await lookUp(b.st, b.session, b.num);
    const added = rec ? !(b.key in rec) : !known.has(b.key), isNew = !added && !!(rec && s.last && rec[b.key] && s.last > rec[b.key]);
    return { ...b, ...s, added, isNew, stance: showStance(l) ? b.stance : "", note: noteOf(l, b) };
  }));
  const f = readFollows();
  if (f[slug] && f[slug].title !== l.title) { f[slug] = { ...f[slug], title: l.title }; writeFollows(f); }
  const t = TABS.get(id);
  if (t) { t.label = l.title || "A shared list"; t.count = rows.length; }
  const n = rows.length, missing = rows.filter((x) => !(`${x.session}:${x.num}` in readWatch(x.st))).length;
  const meta = [l.group ? `<span class="grp">${esc(l.group)}</span>` : "", `${n} bill${n === 1 ? "" : "s"}`, l.updated ? `updated ${fmtDay(l.updated.slice(0, 10))}` : ""].filter(Boolean).join(" · ");
  p.innerHTML = `<p class="sub">${meta} · <a href="/list/#${esc(slug)}">Its page</a></p>`
    + (l.intro ? `<details class="quietbox intro"><summary>About this list</summary>${paras(l.intro)}</details>` : "")
    + `<div class="row">${n ? `<button type="button" class="btn" data-addall="${esc(slug)}"${missing ? "" : " disabled"}>${missing ? "Add all to my watchlist" : "All on your watchlist"}</button>` : ""}`
    + `<button type="button" class="btn quiet" data-unfollow="${esc(slug)}">Unfollow</button><span class="muted" data-msg="${esc(slug)}"></span></div>`
    + (rows.length ? byState(rows.map((x) => listRow(id, x)), false, billRow) : NO_BILLS);
  FOLLOWED[slug] = rows;
  loaded(id, rows.map((x) => ({ key: x.key, last: x.last })), rows.filter((x) => x.added || x.isNew).map((x) => x.key));
}
const FOLLOWED = {};        // slug -> the followed list's rows as drawn
function drawFollows() { return Promise.all(Object.keys(readFollows()).filter((s) => !editKeyFor(s)).map(drawFollow)); }

// ---- The lists' buttons ----
$("panels").addEventListener("click", (e) => {
  const c = e.target.closest("button[data-copylist]");
  if (c) { countUse("your-bills/list link copied"); return copy(c, listLink(c.dataset.copylist)); }
  const k = e.target.closest("button[data-copykey]");
  if (k) { const l = readNamed()[k.dataset.copykey]; return l && copy(k, `${l.slug} ${l.editKey}`); }
  const g = e.target.closest("button[data-forget]");
  if (g) { const all = readNamed(); delete all[g.dataset.forget]; writeNamed(all); syncTabs(); return select("starred"); }
  const u = e.target.closest("button[data-unfollow]");
  if (u) {
    const f = readFollows();
    delete f[u.dataset.unfollow];
    writeFollows(f);
    const s = readSeen(); delete s[`follow:${u.dataset.unfollow}`]; writeSeen(s);
    countUse("your-bills/unfollowed");
    syncTabs();
    return select("starred", { user: true, focus: true });
  }
  const a = e.target.closest("button[data-addall]");
  if (a) {
    let n = 0;
    for (const x of FOLLOWED[a.dataset.addall] || []) {
      const w = readWatch(x.st), k2 = `${x.session}:${x.num}`;
      if (k2 in w) continue;
      w[k2] = { seen: x.last || today(), stance: x.stance || "support" };
      writeWatch(x.st, w);
      n++;
    }
    a.disabled = true; a.textContent = "All on your watchlist";
    const m = a.parentElement.querySelector("[data-msg]");
    if (m) m.textContent = `Added ${n} bill${n === 1 ? "" : "s"} to Starred.`;
    countUse("your-bills/added all");
    draw(); schedule();
    return;
  }
  const sh = e.target.closest("a[data-share]");
  if (sh && !sh.closest("#share")) countUse(`your-bills/list share by ${sh.dataset.share}`);
});

// ---- A list made on another device: its key connects it here ----
$("listConnect").addEventListener("click", async () => {
  const [slug, key] = $("listKey").value.trim().split(/\s+/), msg = $("listMsg");
  if (!slug || !key) return (msg.textContent = "Paste the key exactly as it was copied: a name, a space and a code.");
  try {
    await api(`/lists/${encodeURIComponent(slug)}/views`, { headers: { "X-Edit-Key": key } });
    const w = await api(`/lists/${encodeURIComponent(slug)}`, { headers: { "X-Edit-Key": key } });
    if (w.state !== "all") return (msg.textContent = `That key is for a list shared from ${stName(w.state)}'s watchlist; use it there.`);
    const p = { title: w.title || "", bills: w.bills, intro: w.intro || "", notes: w.notes || {} };
    const all = readNamed();
    all[slug] = { slug, editKey: key, ...p, group: w.group || "", saved: JSON.stringify([p.title, p.bills, p.intro, p.notes]), updated: w.updated };
    writeNamed(all);
    $("listKey").value = ""; msg.textContent = ""; $("connectList").open = false;
    countUse("your-bills/connected a list");
    syncTabs();
    await drawList(all[slug]);
    select(`list:${slug}`, { user: true, focus: true });
  } catch (err) { msg.textContent = err.message; }
});

// A change in another tab (a star on a state's page, a list edited or followed): redraw, and keep the shared list in step.
addEventListener("storage", (e) => {
  if (/^abt:(?:[a-z]{2}:)?watch$/.test(e.key || "")) draw();
  if (e.key === NAMED || e.key === PUB) { syncTabs(); drawLists(); }
  if (e.key === FOLLOWS) {
    const had = new Set([...TABS.keys()]);
    syncTabs();
    for (const id of TABS.keys()) if (!had.has(id) && id.startsWith("follow:")) drawFollow(slugOf(id));
  }
});
syncTabs();
select(tabFromHash() || (() => { try { return localStorage.getItem(TAB_KEY) || ""; } catch (e) { return ""; } })());
draw();
drawLists();
refreshLists();
drawFollows();
countOnce("your-bills/opened");
</script>
</body>
