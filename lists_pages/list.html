<!DOCTYPE html>
<!-- A shared list (/list/#<slug>): the page share links lead to, for lists from one state's watchlist and lists across
     states (lists_worker/). Shows each bill's status, the group's introduction and notes, and lets a visitor follow the list
     (it then shows in Your bills) or add its bills to their own watchlists. build_site.sh writes it to list/index.html, as
     yourbills.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared list · State Bill Tracker</title>
<meta name="description" content="A list of bills shared on State Bill Tracker: where each one is and what's next.">
<meta name="robots" content="noindex">
<!--meta-->
<meta name="lists-api" content="LISTS_API_URL">
<meta name="support" content="SUPPORT_URL">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Where each bill is: the index of the status pieces (common.js's statusOf()), wanted before the script runs. -->
<link rel="preload" href="/status.json" as="fetch" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/*common.css*/
.grp { font-weight: 600; color: var(--ink); }
.intro { margin: 0 0 16px; overflow-wrap: anywhere; }
.intro p { margin: 0 0 10px; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="/">&larr; State Bill Tracker</a><span id="stLink"></span></p>
  <h1 id="title">&nbsp;</h1>
  <p class="sub lmeta" id="by">&nbsp;</p>
  <div class="intro" id="intro"></div>
  <div id="bills"></div>
  <footer><a href="/about/">About</a> &middot; <a href="SUPPORT_URL">Support this site</a></footer>
</main>
<script>
/*common.js*/
/*embed.js*/
</script>
<script>
const today = () => new Date().toISOString().slice(0, 10);
let LIST = null, ROWS = [];   // ROWS: the list's bills, with lookUp()'s answers once known
const slugNow = () => decodeURIComponent(location.hash.replace(/^#(?:list=)?/, "")).trim();
function gone(text) {
  document.title = "Shared list · State Bill Tracker";
  $("title").textContent = "List not found";
  $("by").textContent = text;
  $("intro").innerHTML = ""; Frames.show($("bills"), []); $("stLink").innerHTML = "";
}
// The list's bills are shown by each state's own page: its watchlist view, in a frame per state's session (embed.js).
// A list made in this browser with the list editor sets its sides and takes bills off from there.
async function load() {
  const slug = slugNow();
  if (!slug) return gone("This link is missing the list's name.");
  // This browser's own lists are read with their edit key, so its openings aren't counted as views.
  const key = editKeyFor(slug);
  try {
    LIST = await api(`/lists/${encodeURIComponent(slug)}`, key ? { headers: { "X-Edit-Key": key } } : {});
  } catch (e) {
    return gone(e.status === 404 ? "This list isn't available. Its owner may have stopped sharing it." : "The list couldn't be loaded just now. Try again in a moment.");
  }
  countOnce("list/opened");
  const one = LIST.state !== "all";
  document.title = `${LIST.title || "Shared list"} · State Bill Tracker`;
  $("title").textContent = LIST.title || "Shared list";
  $("stLink").innerHTML = one ? ` &middot; <a href="/${esc(LIST.state)}/">${esc(stName(LIST.state))}</a>` : "";
  const bills = listBills(LIST);
  // A list made in this browser (it holds the list's key): Edit and Share instead of Follow, and never in the lists it follows.
  OWN = !!editKeyFor(LIST.slug);
  if (OWN) { const f = readFollows(); if (LIST.slug in f) { delete f[LIST.slug]; writeFollows(f); } }
  const named = OWN && readNamed()[LIST.slug];
  ROWS = bills;
  drawButtons();
  $("intro").innerHTML = paras(LIST.intro);
  const extra = (g) => {
    const notes = {};
    if (LIST.group) for (const b of g.bills) { const t = noteOf(LIST, b); if (t) notes[baseNum(b.num)] = t; }
    return { ...(named ? { own: LIST.slug } : {}), ...(Object.keys(notes).length ? { notes, group: LIST.group } : {}) };
  };
  const opt = { extra: (g) => (Object.keys(extra(g)).length ? extra(g) : null) };
  if (!bills.length) { Frames.show($("bills"), []); $("bills").innerHTML = '<p class="muted">No bills on this list yet.</p>'; return; }
  Frames.show($("bills"), await listGroups(`list:${LIST.slug}`, bills, null, opt));
  ROWS = await Promise.all(bills.map(async (b) => ({ ...b, ...(await lookUp(b.st, b.session, b.num)) })));
  Frames.show($("bills"), await listGroups(`list:${LIST.slug}`, bills, ROWS, { ...opt, row: (x) => ({ stance: showStance(LIST) ? x.stance : "", note: noteOf(LIST, x) }) }));
  drawButtons();
}
let OWN = false;
// The summary line: the group, how many bills, when it changed, and the list's links: Edit · Share ▾ for its maker,
// Follow (Unfollow) · Add all to my watchlist for anyone else.
function drawButtons() {
  if (!LIST) return;
  const n = ROWS.length, on = LIST.slug in readFollows(), missing = ROWS.filter((x) => !(`${x.session}:${x.num}` in readWatch(x.st))).length;
  if ($("by").querySelector('[aria-expanded="true"]')) return;
  const msg = $("msg")?.innerHTML || "";
  $("by").innerHTML = [LIST.group ? `<span class="grp">${esc(LIST.group)}</span>` : "", `<span>${n} bill${n === 1 ? "" : "s"}</span>`,
    LIST.updated ? `<span>updated ${fmtDay(LIST.updated.slice(0, 10))}</span>` : "",
    ...(OWN ? [`<a href="${readNamed()[LIST.slug] ? `/lists/edit/#${esc(encodeURIComponent(LIST.slug))}` : "/your-bills/#starred"}">Edit</a>`, sharePop(LIST.slug, LIST.title || "Shared list")]
      : [`<button type="button" class="linkish" id="follow" aria-pressed="${on}">${on ? "Unfollow" : "Follow"}</button>`,
        n ? `<button type="button" class="linkish" id="addAll"${missing ? "" : " disabled"}>${missing ? "Add all to my watchlist" : "All on your watchlist"}</button>` : ""]),
    `<span class="lmsg muted" id="msg">${msg}</span>`].filter(Boolean).join("");
}
$("by").addEventListener("click", (e) => {
  if (e.target.closest("#follow")) {
    const f = readFollows();
    let msg = "";
    if (LIST.slug in f) { delete f[LIST.slug]; countUse("list/unfollowed"); }
    else {
      f[LIST.slug] = { title: LIST.title, group: LIST.group || "", known: ROWS.map((x) => x.key), since: today() };
      msg = `It&rsquo;s in <a href="/your-bills/#tab=${esc(encodeURIComponent(LIST.slug))}">Your bills</a>.`;
      countUse("list/followed");
    }
    writeFollows(f);
    $("msg").innerHTML = msg;
    drawButtons();
    $("follow")?.focus();
  }
  if (e.target.closest("#addAll")) {
    let n = 0;
    for (const x of ROWS) {
      const w = readWatch(x.st), k = `${x.session}:${x.num}`;
      if (k in w) continue;
      w[k] = { seen: x.last || today(), stance: x.stance };
      writeWatch(x.st, w);
      n++;
    }
    $("msg").innerHTML = `Added ${n} bill${n === 1 ? "" : "s"} to <a href="/your-bills/">Your bills</a>.`;
    countUse("list/added all");
    drawButtons();
  }
});
$("bills").addEventListener("click", (e) => {
  if (e.target.closest("li > a")) countUse("list/opened a bill");
});
// The list changed in this browser (its sides or bills, from its cards or the editor): shown again.
addEventListener("storage", (e) => { if (/^abt:(?:[a-z]{2}:)?watch$/.test(e.key || "")) { Frames.refresh(); drawButtons(); } if (e.key === NAMED && LIST && readNamed()[LIST.slug]) { const l = readNamed()[LIST.slug]; LIST = { ...LIST, bills: l.bills, title: l.title || LIST.title }; redraw(); } });
async function redraw() {
  const bills = listBills(LIST);
  ROWS = await Promise.all(bills.map(async (b) => ({ ...b, ...(await lookUp(b.st, b.session, b.num)) })));
  const named = OWN && readNamed()[LIST.slug];
  Frames.show($("bills"), await listGroups(`list:${LIST.slug}`, bills, ROWS, { extra: () => (named ? { own: LIST.slug } : null), row: (x) => ({ stance: showStance(LIST) ? x.stance : "", note: noteOf(LIST, x) }) }));
  drawButtons();
}
addEventListener("hashchange", load);
load();
</script>
</body>
</html>
