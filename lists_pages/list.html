<!DOCTYPE html>
<!-- A shared list (/list/#<slug>): the page share links lead to, for lists from one state's watchlist and lists across
     states (lists_worker/). Shows each bill's status, the group's introduction and notes, and lets a visitor follow the list
     (it then shows in Your bills) or add its bills to their own watchlists. Its bills are drawn as on Your bills (onelist.js,
     watchrows.js), each opening its card in place. build_site.sh writes it to list/index.html, as
     yourbills.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared list · State Bill Tracker</title>
<meta name="description" content="A list of bills shared on State Bill Tracker: where each one is and what's next.">
<meta name="robots" content="noindex">
<!--meta-->
<meta name="lists-api" content="LISTS_API_URL">
<meta name="support" content="SUPPORT_URL">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Where each bill is: the index of the status pieces (common.js's statusOf()), wanted before the script runs. -->
<link rel="preload" href="/status.json" as="fetch" crossorigin="anonymous">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/*common.css*/
.grp { font-weight: 600; color: var(--ink); }
.intro { margin: 0 0 16px; overflow-wrap: anywhere; }
.intro p { margin: 0 0 10px; }
h1#title { position: relative; }
</style>
</head>
<body>
<main>
  <p class="back"><a href="/">&larr; State Bill Tracker</a><span id="stLink"></span></p>
  <h1 id="title">&nbsp;</h1>
  <p class="sub lmeta" id="by">&nbsp;</p>
  <div class="intro" id="intro"></div>
  <div id="bills"></div>
  <footer><a href="/about/">About</a> &middot; <a href="SUPPORT_URL">Support this site</a></footer>
</main>
<script>
/*common.js*/
/*embed.js*/
/*watchrules.js*/
/*onelist.js*/
</script>
<script>
const today = () => new Date().toISOString().slice(0, 10);
let LIST = null, ROWS = [];   // ROWS: the list's bills, as OneList.items() answers them once known
const slugNow = () => decodeURIComponent(location.hash.replace(/^#(?:list=)?/, "")).trim();
function gone(text) {
  document.title = "Shared list · State Bill Tracker";
  $("title").textContent = "List not found";
  $("by").textContent = text;
  $("intro").innerHTML = ""; $("bills").innerHTML = ""; $("stLink").innerHTML = "";
}
// The list's bills in the same rows as Your bills (onelist.js, watchrows.js): the same groups and order, each row opening
// its bill's card in place, drawn by its state's page in a frame (embed.js's Opener).
async function load() {
  const slug = slugNow();
  if (!slug) return gone("This link is missing the list's name.");
  // This browser's own lists are read with their edit key, so its openings aren't counted as views.
  const key = editKeyFor(slug);
  try {
    LIST = await api(`/lists/${encodeURIComponent(slug)}`, key ? { headers: { "X-Edit-Key": key } } : {});
  } catch (e) {
    return gone(e.status === 404 ? "This list isn't available. Its owner may have stopped sharing it." : "The list couldn't be loaded just now. Try again in a moment.");
  }
  countOnce("list/opened");
  // Each list's views apart (its random code, never its title); not the list's own maker (who reads it with its key).
  if (!key) countOnce(`list/opened/${slug}`);
  const one = LIST.state !== "all";
  document.title = `${LIST.title || "Shared list"} · State Bill Tracker`;
  $("title").textContent = LIST.title || "Shared list";
  if (!editKeyFor(LIST.slug) && !madeHere(LIST)) $("title").insertAdjacentHTML("beforeend", makerTip(LIST));
  $("stLink").innerHTML = one ? ` &middot; <a href="/${esc(LIST.state)}/">${esc(stName(LIST.state))}</a>` : "";
  const bills = listBills(LIST);
  // A list made in this browser (it holds the list's key): Edit and Share instead of Follow, and never in the lists it follows.
  OWN = !!editKeyFor(LIST.slug);
  if (OWN) { const f = readFollows(); if (LIST.slug in f) { delete f[LIST.slug]; writeFollows(f); } }
  ROWS = bills;
  drawButtons();
  $("intro").innerHTML = paras(LIST.intro);
  if (!bills.length) { $("bills").innerHTML = '<p class="muted">No bills on this list yet.</p>'; return; }
  const kept = OneList.cached(bills);
  if (kept.length === bills.length) drawRows(kept);
  ROWS = await OneList.items(bills);
  drawRows(ROWS);
  drawButtons();
}
const rowOpt = () => ({ tab: "l", oneState: LIST.state !== "all", stance: showStance(LIST), noteOf: (x) => noteOf(LIST, x), onOpen: () => countUse("list/opened a bill") });
function drawRows(rows) { if (LIST) OneList.draw($("bills"), rows, rowOpt()); }
let OWN = false;
// A list shared from a state's Watchlist tab, made in this browser (that page keeps its key).
function madeHere(l) {
  if (l.state === "all") return false;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i) || "";
      if (k.startsWith(`abt:${l.state}:published:`) && JSON.parse(localStorage.getItem(k) || "null")?.slug === l.slug) return true;
    }
  } catch (e) {}
  return false;
}
// For a visitor whose browser didn't make the list: how its maker can change it from here.
function makerTip(l) {
  const lead = "Made this list? Lists can be changed only from the browser that made them.";
  if (l.state !== "all") {
    const w = `/${esc(l.state)}/watchlist/`;
    return infoTipHtml(`${lead} On that browser, open the <a href="${w}">${esc(stName(l.state))} watchlist</a> and copy the list&rsquo;s key from &ldquo;Use this list on another device&rdquo;. Then paste it into the watchlist here, under &ldquo;Shared this list from another device?&rdquo;`, "wide");
  }
  return infoTipHtml(`${lead} On that browser, open <a href="/your-bills/">Your bills</a> and copy the list&rsquo;s key from &ldquo;Use this list on another device&rdquo;. Then paste it into Your bills here, under &ldquo;Using another device? Paste your list&rsquo;s key&rdquo;.`, "wide");
}
// The summary line: the group, how many bills, when it changed, and the list's links: Edit · Share ▾ for its maker,
// Follow (Unfollow) · Add all to my watchlist for anyone else.
function drawButtons() {
  if (!LIST) return;
  const n = ROWS.length, on = LIST.slug in readFollows(), missing = ROWS.filter((x) => !(`${x.session}:${x.num}` in readWatch(x.st))).length;
  if ($("by").querySelector('[aria-expanded="true"]')) return;
  const msg = $("msg")?.innerHTML || "";
  $("by").innerHTML = [LIST.group ? `<span class="grp">${esc(LIST.group)}</span>` : "", `<span>${n} bill${n === 1 ? "" : "s"}</span>`,
    LIST.updated ? `<span>updated ${fmtDay(LIST.updated.slice(0, 10))}</span>` : "",
    ...(OWN ? [`<a href="${readNamed()[LIST.slug] ? `/lists/edit/#${esc(encodeURIComponent(LIST.slug))}` : "/your-bills/#starred"}">Edit</a>`, sharePop(LIST.slug, LIST.title || "Shared list")]
      : [`<button type="button" class="linkish" id="follow" aria-pressed="${on}">${on ? "Unfollow" : "Follow"}</button>`,
        n ? `<button type="button" class="linkish" id="addAll"${missing ? "" : " disabled"}>${missing ? "Add all to my watchlist" : "All on your watchlist"}</button>` : ""]),
    `<span class="lmsg muted" id="msg">${msg}</span>`].filter(Boolean).join("");
}
$("by").addEventListener("click", (e) => {
  if (e.target.closest("#follow")) {
    const f = readFollows();
    let msg = "";
    if (LIST.slug in f) { delete f[LIST.slug]; countUse("list/unfollowed"); }
    else {
      f[LIST.slug] = { title: LIST.title, group: LIST.group || "", known: ROWS.map((x) => x.key), since: today() };
      msg = `It&rsquo;s in <a href="/your-bills/#tab=${esc(encodeURIComponent(LIST.slug))}">Your bills</a>.`;
      countUse("list/followed");
    }
    writeFollows(f);
    $("msg").innerHTML = msg;
    drawButtons();
    $("follow")?.focus();
  }
  if (e.target.closest("#addAll")) {
    let n = 0;
    for (const x of ROWS) {
      const w = readWatch(x.st), k = `${x.session}:${x.num}`;
      if (k in w) continue;
      w[k] = { seen: x.last || today(), stance: x.stance };
      writeWatch(x.st, w);
      n++;
    }
    $("msg").innerHTML = `Added ${n} bill${n === 1 ? "" : "s"} to <a href="/your-bills/">Your bills</a>.`;
    countUse("list/added all");
    drawButtons();
  }
});
// A row's star: the bill on this browser's watchlist, or off it.
$("bills").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-star]");
  if (!b) return;
  e.preventDefault();
  const [st, session, num] = b.dataset.star.split("|"), w = readWatch(st), k = `${session}:${num}`;
  const x = ROWS.find((r) => r.st === st && +r.session === +session && baseNum(r.full || r.num) === num);
  const on = !(k in w);
  if (on) { w[k] = { seen: x?.last || today(), stance: x?.stance || "support" }; countUse("list/starred"); } else { delete w[k]; countUse("list/unstarred"); }
  writeWatch(st, w);
  for (const s2 of document.querySelectorAll(`button[data-star="${CSS.escape(b.dataset.star)}"]`)) {
    s2.setAttribute("aria-pressed", String(on));
    s2.textContent = on ? "★" : "☆";
    s2.title = on ? "Remove from your watchlist" : "Add to your watchlist";
    s2.setAttribute("aria-label", s2.getAttribute("aria-label").replace(/^(Remove|Add) /, on ? "Remove " : "Add ").replace(/ (from|to) your watchlist$/, on ? " from your watchlist" : " to your watchlist"));
  }
  drawButtons();
});
// The list changed in this browser (stars, or the list itself in the editor): shown again.
addEventListener("storage", (e) => { if (/^abt:([a-z]{2}):watch$/.test(e.key || "")) { drawRows(ROWS); drawButtons(); } if (e.key === NAMED && LIST && readNamed()[LIST.slug]) { const l = readNamed()[LIST.slug]; LIST = { ...LIST, bills: l.bills, title: l.title || LIST.title }; redraw(); } });
async function redraw() {
  ROWS = await OneList.items(listBills(LIST));
  drawRows(ROWS);
  drawButtons();
}
addEventListener("hashchange", load);
load();
</script>
</body>
</html>
