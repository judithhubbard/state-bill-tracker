name: Download state data

# Each state's data, downloaded in its own job and kept in its own cache, which publish.yml builds the site from. The
# states and their commands are in .github/states.json. A state's runs never overlap (a new one waits for the last to
# finish), but states never wait for each other, and nothing here waits for the site to be built.
#
# Run one or more states by hand, for a test or right after a change, without touching the site:
#   gh workflow run download.yml -f states=wi        (or states=wi,mi; empty or "all" for every state)
# Every 2 hours: each full run starts the next one two hours after it began (the "next" job below), since GitHub's
# scheduler skips runs when it's busy (none started from 23:33 to 02:35 UTC on 2026-11-08). The schedule is a backup
# for a broken chain; the "next" job doesn't start a run when one is already waiting or running.
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      states:
        description: "States to download (codes from .github/states.json, comma-separated; empty or 'all' for every state)"
        type: string
        default: "all"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          WANT: ${{ inputs.states }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          want = {s.strip() for s in (os.environ.get("WANT") or "all").split(",") if s.strip()}
          states = json.load(open(".github/states.json"))["states"]
          pick = [s for s in states if not want or "all" in want or s["code"] in want]
          if want - {"all"} - {s["code"] for s in states}:
              raise SystemExit(f"unknown state codes: {sorted(want - {'all'} - {s['code'] for s in states})}")
          include = [{"name": s["name"], "key": s["key"], "path": "\n".join(s["paths"]), "minutes": s["minutes"], "run": s["run"]}
                     for s in pick]
          print("matrix=" + json.dumps({"include": include}))
          PY

  download:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One run at a time per state; a newer one waits rather than overlapping the last.
    concurrency:
      group: download-${{ matrix.key }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Finished sessions' files never change, so each state keeps its files between runs.
      - name: Restore the last copy
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.path }}
          key: ${{ matrix.key }}-${{ github.run_id }}
          restore-keys: ${{ matrix.key }}-
      # When the copy was last checked (data/<state>/last_checked, set below after a successful download): the pages
      # say "updated" from it, since between sessions no bill file may change for weeks.
      - name: Mark the time
        env:
          PATHS: ${{ matrix.path }}
        run: |
          touch "$RUNNER_TEMP/started"
          prev=0
          for d in $PATHS; do [ -f "$d/last_checked" ] && prev=$(stat -c %Y "$d/last_checked"); done
          echo "PREV_CHECKED=$prev" >> "$GITHUB_ENV"
      # A server that stops answering mustn't hold the job: after its time limit the state keeps what it has.
      - name: Download
        id: dl
        timeout-minutes: ${{ matrix.minutes }}
        continue-on-error: true
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          UTAH_API_TOKEN: ${{ secrets.UTAH_API_TOKEN }}
          INDIANA_API_KEY: ${{ secrets.INDIANA_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          # Scripts that read it stop on their own 5 minutes before the step's limit, with a summary.
          FETCH_MINUTES: ${{ matrix.minutes }}
        run: ${{ matrix.run }}
      - name: Mark the copy as checked
        if: steps.dl.outcome == 'success'
        env:
          PATHS: ${{ matrix.path }}
        run: for d in $PATHS; do mkdir -p "$d" && date -u +%Y-%m-%dT%H:%M:%SZ > "$d/last_checked"; done
      # Saved when something changed, or when the saved "last checked" time is over 12 hours old (so the pages' "updated"
      # stays current without filling the cache with identical copies every run).
      - name: See whether anything changed
        id: changed
        if: always()
        env:
          PATHS: ${{ matrix.path }}
        run: |
          n=$(find $PATHS -newer "$RUNNER_TEMP/started" -type f ! -name last_checked 2>/dev/null | wc -l)
          age=$(( $(date +%s) - PREV_CHECKED ))
          echo "$n files changed; last checked mark saved $((age / 3600)) hours ago"
          echo "any=$([ "$n" -gt 0 ] || [ "$age" -gt 43200 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Save the copy
        if: always() && steps.changed.outputs.any == 'yes'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.path }}
          key: ${{ matrix.key }}-${{ github.run_id }}

  next:
    needs: download
    # After every full run (scheduled, or by hand for every state), whatever happened to single states: a state's job
    # bumped by a newer run of that state counts as cancelled, and mustn't break the chain.
    if: ${{ always() && (github.event_name == 'schedule' || inputs.states == 'all' || inputs.states == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: write
    steps:
      - name: Start the next run two hours after this one began
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          began=$(gh run view "$RUN" -R "$REPO" --json createdAt -q .createdAt)
          wait=$(( $(date -d "$began" +%s) + 7200 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then echo "waiting $((wait / 60)) minutes"; sleep "$wait"; fi
          others=$(gh run list -R "$REPO" --workflow download.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != $RUN and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "$others" -gt 0 ]; then echo "another download run is already waiting or running; not starting one"; exit 0; fi
          gh workflow run download.yml -R "$REPO" -f states=all
          echo "started the next download run"
