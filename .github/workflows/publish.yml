name: Publish statebilltracker.org

# Builds the site (build_site.sh) from each state's latest saved download (download.yml keeps them) and puts it on
# Cloudflare Pages (project "statebilltracker"). Needs the secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID. It downloads nothing but New York's current bills and rebuilds only the states whose data or
# code changed (state_hash.py; the rest are copied from the last build), so it takes a few minutes whatever the states
# are doing; a design change goes live with `gh workflow run publish.yml`. After each download run, every 2 hours (about
# 360 publishes a month, under Cloudflare's 500); the data checks run once a day (the 10:50 UTC run) or when asked
# (`gh workflow run publish.yml -f checks=true`). At launch, see "Launch checklist" in CLAUDE.md.
on:
  # After each download run (every 2 hours), so publishing never waits on GitHub's scheduler, which skips runs.
  workflow_run:
    workflows: ["Download state data"]
    types: [completed]
  schedule:
    - cron: "50 10 * * *"                           # the daily data checks
  workflow_dispatch:
    inputs:
      checks:
        description: "Also run the data checks (about 15 minutes more)"
        type: boolean
        default: false

permissions:
  contents: read

# One publish at a time, so an older build can never replace a newer one.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore New Jersey and Virginia
        uses: actions/cache/restore@v4
        with:
          path: "data/nj\ndata/va"
          key: nj-data-v2-latest
          restore-keys: nj-data-v2-
      - name: Restore California
        uses: actions/cache/restore@v4
        with:
          path: "data/ca"
          key: ca-data-v1-latest
          restore-keys: ca-data-v1-
      - name: Restore Texas
        uses: actions/cache/restore@v4
        with:
          path: "data/tx"
          key: tx-data-v1-latest
          restore-keys: tx-data-v1-
      - name: Restore Illinois
        uses: actions/cache/restore@v4
        with:
          path: "data/il"
          key: il-data-v1-latest
          restore-keys: il-data-v1-
      - name: Restore Washington
        uses: actions/cache/restore@v4
        with:
          path: "data/wa"
          key: wa-data-v1-latest
          restore-keys: wa-data-v1-
      - name: Restore Connecticut
        uses: actions/cache/restore@v4
        with:
          path: "data/ct"
          key: ct-data-v1-latest
          restore-keys: ct-data-v1-
      - name: Restore Oregon
        uses: actions/cache/restore@v4
        with:
          path: "data/or"
          key: or-data-v1-latest
          restore-keys: or-data-v1-
      - name: Restore Ohio
        uses: actions/cache/restore@v4
        with:
          path: "data/oh"
          key: oh-data-v1-latest
          restore-keys: oh-data-v1-
      - name: Restore Massachusetts
        uses: actions/cache/restore@v4
        with:
          path: "data/ma"
          key: ma-data-v1-latest
          restore-keys: ma-data-v1-
      - name: Restore Maryland
        uses: actions/cache/restore@v4
        with:
          path: "data/md"
          key: md-data-v1-latest
          restore-keys: md-data-v1-
      - name: Restore Georgia
        uses: actions/cache/restore@v4
        with:
          path: "data/ga"
          key: ga-data-v1-latest
          restore-keys: ga-data-v1-
      - name: Restore Michigan
        uses: actions/cache/restore@v4
        with:
          path: "data/mi"
          key: mi-data-v1-latest
          restore-keys: mi-data-v1-
      - name: Restore Wisconsin
        uses: actions/cache/restore@v4
        with:
          path: "data/wi"
          key: wi-data-v1-latest
          restore-keys: wi-data-v1-
      - name: Restore Arizona
        uses: actions/cache/restore@v4
        with:
          path: "data/az"
          key: az-data-v1-latest
          restore-keys: az-data-v1-
      - name: Restore North Carolina
        uses: actions/cache/restore@v4
        with:
          path: "data/nc"
          key: nc-data-v1-latest
          restore-keys: nc-data-v1-
      - name: Restore Colorado
        uses: actions/cache/restore@v4
        with:
          path: "data/co"
          key: co-data-v1-latest
          restore-keys: co-data-v1-
      - name: Restore South Dakota
        uses: actions/cache/restore@v4
        with:
          path: "data/sd"
          key: sd-data-v1-latest
          restore-keys: sd-data-v1-
      - name: Restore Wyoming
        uses: actions/cache/restore@v4
        with:
          path: "data/wy"
          key: wy-data-v1-latest
          restore-keys: wy-data-v1-
      - name: Restore Utah
        uses: actions/cache/restore@v4
        with:
          path: "data/ut"
          key: ut-data-v1-latest
          restore-keys: ut-data-v1-
      - name: Restore Indiana
        uses: actions/cache/restore@v4
        with:
          path: "data/in"
          key: in-data-v1-latest
          restore-keys: in-data-v1-
      - name: Restore Arkansas
        uses: actions/cache/restore@v4
        with:
          path: "data/ar"
          key: ar-data-v1-latest
          restore-keys: ar-data-v1-
      - name: Restore Alaska
        uses: actions/cache/restore@v4
        with:
          path: "data/ak"
          key: ak-data-v1-latest
          restore-keys: ak-data-v1-
      - name: Restore the LegiScan states
        uses: actions/cache/restore@v4
        with:
          path: |
            data/legiscan
            data/tn
            data/ok
            data/me
            data/ri
            data/vt
          key: legiscan-data-v1-latest
          restore-keys: legiscan-data-v1-
      - name: Restore New Hampshire
        uses: actions/cache/restore@v4
        with:
          path: "data/nh"
          key: nh-data-v1-latest
          restore-keys: nh-data-v1-
      - name: Restore Mississippi
        uses: actions/cache/restore@v4
        with:
          path: "data/ms"
          key: ms-data-v1-latest
          restore-keys: ms-data-v1-
      - name: Restore Montana
        uses: actions/cache/restore@v4
        with:
          path: "data/mt"
          key: mt-data-v1-latest
          restore-keys: mt-data-v1-
      - name: Restore North Dakota
        uses: actions/cache/restore@v4
        with:
          path: "data/nd"
          key: nd-data-v1-latest
          restore-keys: nd-data-v1-
      - name: Restore Pennsylvania
        uses: actions/cache/restore@v4
        with:
          path: "data/pa"
          key: pa-data-v1-latest
          restore-keys: pa-data-v1-

      # New York from this shared code (statebilltracker.pages.dev/ny/, not linked; albanybilltracker.org runs
      # from its own repo until New York moves here). The data albanybilltracker.org's repo commits (past sessions,
      # contacts, Assembly votes) is copied from it, so nothing is downloaded from nyassembly.gov twice; the current
      # session's bills come from the Senate's API, which needs the NYSENATE_API_KEY secret (without it, New York
      # is left out).
      - name: Download New York
        env:
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
        run: |
          if [ -z "$NYSENATE_API_KEY" ]; then echo "No NYSENATE_API_KEY secret: New York left out"; exit 0; fi
          git clone -q --depth 1 https://github.com/judithhubbard/ny-bill-tracker.git "$RUNNER_TEMP/ny"
          cp "$RUNNER_TEMP"/ny/data/*.json "$RUNNER_TEMP"/ny/data/*.json.gz data/
          NY=$(python3 -c "import datetime; y = datetime.date.today().year; print(y if y % 2 else y - 1)")
          python3 fetch_bills.py "$NY" || { echo "New York's bills didn't download: left out"; rm -f "data/bills_$NY.json"; }

      # Each state's pages from the last build: a state whose data and code haven't changed isn't rebuilt (state_hash.py).
      - name: Restore the last build's pages
        uses: actions/cache/restore@v4
        with:
          path: built
          key: built-pages-latest
          restore-keys: built-pages-

      # Until launch the site lives at statebilltracker.pages.dev, so its links point there.
      - name: Build the site
        id: build
        env:
          SITE_BASE: https://statebilltracker.pages.dev/
        run: |
          set -o pipefail
          ./build_site.sh _site | tee "$RUNNER_TEMP/build.log"
          grep -q '^rebuilt: none$' "$RUNNER_TEMP/build.log" || echo "rebuilt=yes" >> "$GITHUB_OUTPUT"

      # Kept only when some state was rebuilt.
      - name: Keep the pages for the next build
        if: steps.build.outputs.rebuilt == 'yes'
        uses: actions/cache/save@v4
        with:
          path: built
          key: built-pages-${{ github.run_id }}

      - name: Put it on Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.152.0 pages deploy _site --project-name=statebilltracker --branch=main --commit-dirty=true

      # Last, so the site is already published: a problem fails the run, and GitHub emails the owner. Once a day.
      - name: Check the data is sound
        if: ${{ github.event.schedule == '50 10 * * *' || inputs.checks }}
        run: python3 check_site.py

      # Every state against the "Data traps found so far" list in CLAUDE.md.
      - name: Check every state for the known data traps
        if: ${{ always() && (github.event.schedule == '50 10 * * *' || inputs.checks) }}
        run: python3 test/data_check.py
