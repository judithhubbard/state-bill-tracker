# Copied from ny-bill-tracker, renamed and bound to its own KV namespace (STATE_LISTS), so a deploy from here can't touch
# the live NY Worker or its lists.
name = "state-lists"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Published watchlists and the invite codes that may create them.
[[kv_namespaces]]
binding = "LISTS"
id = "180ec60d09f84eafb686aa0f0845ed67"  # the STATE_LISTS namespace (not Albany's LISTS)

# ADMIN_TOKEN is a secret (wrangler secret put ADMIN_TOKEN); it is never stored here.
