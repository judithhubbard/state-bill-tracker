<!DOCTYPE html>
<!-- statebilltracker.org's front page: a tile map of the states and a searchable list. build_site.sh copies it to the top
     of the site and replaces the list's items with the states built in that run; the map reads which states are built
     from the list, so it needs no other data. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State Bill Tracker</title>
<meta name="description" content="Follow bills in your state legislature: where each one is, who decides next, and what to ask them.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root {
  --paper: #f6f8fb; --sheet: #ffffff; --ink: #14213d; --ink-2: #4a5878; --rule: #d9e0ec; --navy: #1d3b78;
  --tile-off: #e3e8f1; --tile-off-ink: #8a96ad; --tile-on-ink: #ffffff; --mine: #c8901f;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1626; --sheet: #162036; --ink: #e6ebf5; --ink-2: #a3b0c9; --rule: #2a3754; --navy: #8fb0f0;
    --tile-off: #1f2a42; --tile-off-ink: #5d6a85; --tile-on-ink: #0f1626; --mine: #e0b04e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1626; --sheet: #162036; --ink: #e6ebf5; --ink-2: #a3b0c9; --rule: #2a3754; --navy: #8fb0f0;
  --tile-off: #1f2a42; --tile-off-ink: #5d6a85; --tile-on-ink: #0f1626; --mine: #e0b04e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); padding: 40px 16px 64px; }
main { max-width: 680px; margin: 0 auto; }
h1 { font: 800 clamp(34px, 8vw, 48px)/1.05 var(--display); font-stretch: 85%; margin: 0 0 12px; }
h2 { font: 700 15px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 32px 0 12px; }
p.lede { color: var(--ink-2); margin: 0 0 24px; font-size: 17px; }
.mine { display: none; margin: 0 0 24px; }
.mine a { display: inline-block; background: var(--navy); color: var(--tile-on-ink); text-decoration: none; border-radius: 8px;
  padding: 10px 16px; font: 700 17px/1.2 var(--display); }
/* The tile map: one equal square per state, roughly where it sits on a map (11 columns by 8 rows). */
.tiles { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin: 0 0 8px; }
.tiles a, .tiles span { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px;
  font: 700 clamp(10px, 2.6vw, 15px)/1 var(--display); text-decoration: none; }
.tiles a { background: var(--navy); color: var(--tile-on-ink); }
.tiles a:hover, .tiles a:focus-visible { outline: 3px solid var(--mine); outline-offset: 1px; }
.tiles a.me { box-shadow: inset 0 0 0 3px var(--mine); }
.tiles span { background: var(--tile-off); color: var(--tile-off-ink); }
.legend { color: var(--ink-2); font-size: 14px; margin: 0; display: flex; gap: 16px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.find { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet);
  color: var(--ink); margin: 0 0 12px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
li a { display: block; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px;
  color: var(--ink); text-decoration: none; height: 100%; }
li a:hover, li a:focus-visible { border-color: var(--navy); }
li b { display: block; font: 700 19px/1.2 var(--display); color: var(--navy); }
li span { color: var(--ink-2); font-size: 14px; }
.none { color: var(--ink-2); display: none; }
footer { margin-top: 32px; color: var(--ink-2); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>State Bill Tracker</h1>
  <p class="lede">Follow bills in your state legislature: where each one is, who decides next, and what to ask them. No account needed.</p>
  <p class="mine" id="mine"></p>
  <div class="tiles" id="tiles" aria-hidden="true"></div>
  <p class="legend" id="legend" hidden><span><i style="background:var(--navy)"></i>Ready</span><span><i style="background:var(--tile-off)"></i>Coming soon</span></p>
  <h2>States</h2>
  <input class="find" id="find" type="search" placeholder="Find a state" aria-label="Find a state" hidden>
  <ul id="states">
    <li><a href="ca/"><b>California</b><span>Bills in the California State Legislature</span></a></li>
  </ul>
  <p class="none" id="none">No state by that name is ready yet.</p>
  <footer>Your watchlist stays in your browser.</footer>
</main>
<script>
// Grid positions (row, column) of a common tile-map layout.
const GRID = { AK: [0, 0], ME: [0, 10], VT: [1, 9], NH: [1, 10],
  WA: [2, 0], ID: [2, 1], MT: [2, 2], ND: [2, 3], MN: [2, 4], IL: [2, 5], WI: [2, 6], MI: [2, 7], NY: [2, 8], RI: [2, 9], MA: [2, 10],
  OR: [3, 0], NV: [3, 1], WY: [3, 2], SD: [3, 3], IA: [3, 4], IN: [3, 5], OH: [3, 6], PA: [3, 7], NJ: [3, 8], CT: [3, 9],
  CA: [4, 0], UT: [4, 1], CO: [4, 2], NE: [4, 3], MO: [4, 4], KY: [4, 5], WV: [4, 6], VA: [4, 7], MD: [4, 8], DE: [4, 9],
  AZ: [5, 1], NM: [5, 2], KS: [5, 3], AR: [5, 4], TN: [5, 5], NC: [5, 6], SC: [5, 7],
  OK: [6, 3], LA: [6, 4], MS: [6, 5], AL: [6, 6], GA: [6, 7],
  HI: [7, 0], TX: [7, 3], FL: [7, 7] };
const NAMES = { AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado", CT: "Connecticut",
  DE: "Delaware", FL: "Florida", GA: "Georgia", HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa",
  KS: "Kansas", KY: "Kentucky", LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan",
  MN: "Minnesota", MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire",
  NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota", OH: "Ohio", OK: "Oklahoma",
  OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TN: "Tennessee",
  TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia", WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming" };
// The states built in this run: the list's links ("ca/").
const built = {};
for (const a of document.querySelectorAll("#states a")) built[a.getAttribute("href").replace(/\/.*$/, "").toUpperCase()] = a.getAttribute("href");
// The state this browser visited last (remembered when a state is chosen here).
let mine = null;
try { mine = localStorage.getItem("sbt:state"); } catch (e) {}
const remember = (code) => { try { localStorage.setItem("sbt:state", code); } catch (e) {} };
if (mine && built[mine]) {
  const p = document.getElementById("mine");
  p.innerHTML = `<a href="${built[mine]}">${NAMES[mine]} →</a>`;
  p.style.display = "block";
}
const tiles = document.getElementById("tiles");
tiles.innerHTML = Object.entries(GRID).map(([code, [r, c]]) => {
  const style = `grid-row:${r + 1};grid-column:${c + 1}`;
  return built[code]
    ? `<a href="${built[code]}" style="${style}" title="${NAMES[code]}" data-code="${code}"${code === mine ? ' class="me"' : ""}>${code}</a>`
    : `<span style="${style}" title="${NAMES[code]}: coming soon">${code}</span>`;
}).join("");
tiles.removeAttribute("aria-hidden");
document.getElementById("legend").hidden = false;
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href]");
  const code = a && (a.dataset.code || a.getAttribute("href").replace(/\/.*$/, "").toUpperCase());
  if (code && built[code]) remember(code);
});
// Find a state: filters the list as you type.
const find = document.getElementById("find");
find.hidden = false;
find.addEventListener("input", () => {
  const q = find.value.trim().toLowerCase();
  let shown = 0;
  for (const li of document.querySelectorAll("#states li")) {
    const hit = !q || li.textContent.toLowerCase().includes(q);
    li.hidden = !hit;
    shown += hit;
  }
  document.getElementById("none").style.display = shown ? "none" : "block";
});
</script>
</body>
</html>
